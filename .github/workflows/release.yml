# Release on tag: rebuild, check the tag against App.about.version, attach the file, notes from the tag message.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" src/js/07-settings.js)
          echo "tag=$tag version=$version"
          [ "$tag" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match App.about.version $version" >&2; exit 1; }
      - name: Build
        run: ./build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the message of the annotated tag (git tag -a -F notes.md). A shallow
          # checkout is not trusted to keep the tag object, so it is fetched once more.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes=--notes-from-tag
          else
            # A lightweight tag has no message, and the bump commit makes poor release notes.
            echo "Lightweight tag, falling back to generated notes" >&2
            notes=--generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" ai-image-metadata-viewer.html \
            --title "$GITHUB_REF_NAME" \
            "$notes"
