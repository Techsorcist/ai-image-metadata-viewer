# Release on tag: rebuild, check the tag against App.about.version, attach the file.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" src/js/07-settings.js)
          echo "tag=$tag version=$version"
          [ "$tag" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match App.about.version $version" >&2; exit 1; }
      - name: Build
        run: ./build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ai-image-metadata-viewer.html \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
