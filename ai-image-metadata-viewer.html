      card.models.push({ role: 'lora', name: name(lm), hash: (lm && lm.hash) || null, weight: l && l.weight != null ? String(l.weight) : null });
    }
  }

  for (const [k, v] of Object.entries(m)) addExtra(card, k, v);
  return card;
});

App.parsers.register('invokeai-legacy', (record) => {
  const { emptyCard, addParam, addExtra } = App.parsers;
  const card = emptyCard();
  const sd = record.entries.find(e => e.key === 'sd-metadata');
  const dream = record.entries.find(e => e.key === 'Dream');

  if (sd && sd.json) {
    const j = sd.json;
    const img = Object.assign({}, j.image || {});
    const take = (key) => { if (!(key in img)) return null; const v = img[key]; delete img[key]; return v; };
    const prompt = take('prompt');
    if (Array.isArray(prompt)) {
      card.positive.text = prompt.map(p => (p && typeof p === 'object') ? p.prompt : String(p)).filter(Boolean).join('\n');
    } else if (prompt != null) {
      card.positive.text = String(prompt);
    }
    // Old InvokeAI kept the negative in square brackets inside the prompt.
    const neg = [...card.positive.text.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
    if (neg.length) card.negative.text = neg.join(', ');

    addParam(card, 'Model', j.model_weights || j.model);
    addParam(card, 'Seed', take('seed'));
    addParam(card, 'Steps', take('steps'));
    addParam(card, 'CFG', take('cfg_scale'));
    addParam(card, 'Sampler', take('sampler'));
    const w = take('width'), h = take('height');
    addParam(card, 'Size', w && h ? `${w} × ${h}` : null);
    addParam(card, 'Version', j.app_version);
    if (j.model_weights || j.model) card.models.push({ role: 'checkpoint', name: j.model_weights || j.model, hash: j.model_hash || null, weight: null });
    for (const [k, v] of Object.entries(img)) addExtra(card, k, v);
    for (const k of ['app_id', 'model', 'model_hash']) if (k in j) addExtra(card, k, j[k]);
    return card;
  }

  if (dream) {
    // "prompt text" -s 50 -S 12345 -W 512 -H 512 -C 7.5 -A k_lms
    const m = /^"([\s\S]*?)"\s*(.*)$/.exec(dream.value.trim());
    if (m) {
      card.positive.text = m[1];
      const flags = {};
      for (const f of m[2].matchAll(/-(\w)\s+(\S+)/g)) flags[f[1]] = f[2];
      addParam(card, 'Seed', flags.S);
      addParam(card, 'Steps', flags.s);
      addParam(card, 'CFG', flags.C);
      addParam(card, 'Sampler', flags.A);
      addParam(card, 'Size', flags.W && flags.H ? `${flags.W} × ${flags.H}` : null);
      for (const [k, v] of Object.entries(flags)) if (!'SsCAWH'.includes(k)) addExtra(card, `-${k}`, v);
    } else {
      card.positive.text = dream.value;
    }
  }
  return card;
});

// ---- src/js/64-comfy-workflow.js ----
// Converts a ComfyUI UI graph (workflow: nodes[], links[], widgets_values) into an API-like
// graph { id: { class_type, inputs, _meta } } that analyzeComfyGraph understands.
//
// Rules:
//   - muted (mode 2) nodes are dropped and links through them are cut;
//   - bypassed (mode 4) nodes pass an input through to the output of matching type; the link
//     is redirected to their source; they themselves do not enter the graph;
//   - Note and MarkdownNote do not enter the graph and are returned separately;
//   - widget values are named from a table for known types, heuristically for the rest,
//     and a link into an input always takes precedence over the widget value.
App.comfyWorkflow = (() => {
  const MODE_MUTED = 2;
  const MODE_BYPASS = 4;
  const NOTE_TYPES = new Set(['Note', 'MarkdownNote']);

  // widgets_values order for standard nodes.
  const WIDGETS = {
    KSampler: ['seed', 'control_after_generate', 'steps', 'cfg', 'sampler_name', 'scheduler', 'denoise'],
    KSamplerAdvanced: ['add_noise', 'noise_seed', 'control_after_generate', 'steps', 'cfg', 'sampler_name', 'scheduler', 'start_at_step', 'end_at_step', 'return_with_leftover_noise'],
    SamplerCustom: ['add_noise', 'noise_seed', 'control_after_generate', 'cfg'],
    SamplerCustomAdvanced: [],
    RandomNoise: ['noise_seed', 'control_after_generate'],
    KSamplerSelect: ['sampler_name'],
    BasicScheduler: ['scheduler', 'steps', 'denoise'],
    BasicGuider: [],
    CFGGuider: ['cfg'],
    CLIPTextEncode: ['text'],
    CLIPTextEncodeSDXL: ['width', 'height', 'crop_w', 'crop_h', 'target_width', 'target_height', 'text_g', 'text_l'],
    CLIPTextEncodeSDXLRefiner: ['ascore', 'width', 'height', 'text'],
    CheckpointLoaderSimple: ['ckpt_name'],
    CheckpointLoader: ['config_name', 'ckpt_name'],
    UNETLoader: ['unet_name', 'weight_dtype'],
    LoraLoader: ['lora_name', 'strength_model', 'strength_clip'],
    LoraLoaderModelOnly: ['lora_name', 'strength_model'],
    VAELoader: ['vae_name'],
    CLIPLoader: ['clip_name', 'type'],
    DualCLIPLoader: ['clip_name1', 'clip_name2', 'type'],
    CLIPSetLastLayer: ['stop_at_clip_layer'],
    EmptyLatentImage: ['width', 'height', 'batch_size'],
    EmptySD3LatentImage: ['width', 'height', 'batch_size'],
    LatentUpscale: ['upscale_method', 'width', 'height', 'crop'],
    LatentUpscaleBy: ['upscale_method', 'scale_by'],
    ImageScale: ['upscale_method', 'width', 'height', 'crop'],
    ImageScaleBy: ['upscale_method', 'scale_by'],
    UpscaleModelLoader: ['model_name'],
    ImageUpscaleWithModel: [],
    ControlNetLoader: ['control_net_name'],
    ControlNetApply: ['strength'],
    ControlNetApplyAdvanced: ['strength', 'start_percent', 'end_percent'],
    ModelMergeSimple: ['ratio'],
    CLIPMergeSimple: ['ratio'],
    ModelSamplingDiscrete: ['sampling', 'zsnr'],
    ModelSamplingFlux: ['max_shift', 'base_shift', 'width', 'height'],
    FluxGuidance: ['guidance'],
    LoadImage: ['image', 'upload'],
    SaveImage: ['filename_prefix'],
    PreviewImage: [],
    VAEDecode: [],
    VAEEncode: [],
    PrimitiveNode: ['value', 'control_after_generate'],
    PrimitiveString: ['value'],
    PrimitiveStringMultiline: ['value'],
    PrimitiveInt: ['value', 'control_after_generate'],
    PrimitiveFloat: ['value'],
    StringConstant: ['string'],
    StringConstantMultiline: ['string', 'strip_newlines'],
  };

  const SAMPLERS = /^(euler|euler_ancestral|euler_cfg_pp|heun|heunpp2|dpm_2|dpm_2_ancestral|lms|dpm_fast|dpm_adaptive|dpmpp_2s_ancestral|dpmpp_sde|dpmpp_sde_gpu|dpmpp_2m|dpmpp_2m_sde|dpmpp_2m_sde_gpu|dpmpp_3m_sde|dpmpp_3m_sde_gpu|ddpm|lcm|ddim|uni_pc|uni_pc_bh2|res_multistep|ipndm|deis|er_sde|seeds_2|gradient_estimation)/;
  const SCHEDULERS = new Set(['normal', 'karras', 'exponential', 'sgm_uniform', 'simple', 'ddim_uniform', 'beta', 'linear_quadratic', 'kl_optimal', 'ays', 'gits']);

  // For an unknown node type, assign names based on the values' contents.
  function guessWidgetNames(node, values) {
    const outputsString = (node.outputs || []).some(o => o && /STRING|CONDITIONING/i.test(String(o.type)));
    const textual = outputsString || /text|prompt|string|note|wildcard/i.test(node.type);
    const names = [];
    let textGiven = false;
    values.forEach((v, i) => {
      if (typeof v === 'string' && !textGiven && textual && v.trim() !== '' && !SAMPLERS.test(v) && !SCHEDULERS.has(v)) {
        names.push('text');
        textGiven = true;
      } else if (typeof v === 'string' && SAMPLERS.test(v)) {
        names.push('sampler_name');
      } else if (typeof v === 'string' && SCHEDULERS.has(v)) {
        names.push('scheduler');
      } else if (typeof v === 'number' && Number.isInteger(v) && v > 1e9) {
        names.push('seed');
      } else {
        names.push(`widget_${i}`);
      }
    });
    return names;
  }

  function convert(workflow) {
    const nodes = Array.isArray(workflow.nodes) ? workflow.nodes : [];
    const rawLinks = Array.isArray(workflow.links) ? workflow.links : [];
    const byId = new Map(nodes.map(n => [String(n.id), n]));

    // links: [id, srcNode, srcSlot, dstNode, dstSlot, type] or objects in newer versions.
    const links = new Map();
    for (const l of rawLinks) {
      if (Array.isArray(l)) links.set(l[0], { src: String(l[1]), srcSlot: l[2], dst: String(l[3]), dstSlot: l[4], type: l[5] });
      else if (l && typeof l === 'object') links.set(l.id, { src: String(l.origin_id), srcSlot: l.origin_slot, dst: String(l.target_id), dstSlot: l.target_slot, type: l.type });
    }

    // Link source accounting for bypass: a bypassed node yields the input of the same type as the output.
    function resolve(linkId, depth = 0) {
      const link = links.get(linkId);
      if (!link || depth > 64) return null;
      const src = byId.get(link.src);
      if (!src || src.mode === MODE_MUTED) return null;
      if (src.mode === MODE_BYPASS) {
        const out = (src.outputs || [])[link.srcSlot];
        const wantType = out ? out.type : link.type;
        const inputs = src.inputs || [];
        let candidate = inputs.find(i => i && i.link != null && i.type === wantType);
        if (!candidate) candidate = inputs.find(i => i && i.link != null && String(i.type).toUpperCase() === String(wantType).toUpperCase());
        if (!candidate) candidate = inputs.find(i => i && i.link != null);
        return candidate ? resolve(candidate.link, depth + 1) : null;
      }
      return [link.src, link.srcSlot];
    }

    const graph = {};
    const notes = [];
    const status = {}; // id -> 'muted' | 'bypassed' | 'note' | 'active'

    for (const n of nodes) {
      const id = String(n.id);
      if (NOTE_TYPES.has(n.type)) {
        status[id] = 'note';
        const text = Array.isArray(n.widgets_values) ? n.widgets_values.find(v => typeof v === 'string') : null;
        notes.push({ id, classType: n.type, title: n.title || null, field: 'note', text: text || '', kind: 'note' });
        continue;
      }
      if (n.mode === MODE_MUTED) { status[id] = 'muted'; continue; }
      if (n.mode === MODE_BYPASS) { status[id] = 'bypassed'; continue; }
      status[id] = 'active';

      const inputs = {};
      const values = Array.isArray(n.widgets_values) ? n.widgets_values
        : (n.widgets_values && typeof n.widgets_values === 'object' ? Object.values(n.widgets_values) : []);
      const names = WIDGETS[n.type] || guessWidgetNames(n, values);
      values.forEach((v, i) => {
        const name = names[i] || `widget_${i}`;
        if (name === 'control_after_generate') return;
        if (v !== null && typeof v !== 'object') inputs[name] = v;
      });

      for (const inp of n.inputs || []) {
        if (!inp || inp.link == null) continue;
        const source = resolve(inp.link);
        const name = inp.name || (inp.widget && inp.widget.name);
        if (!name) continue;
        if (source) inputs[name] = source;
        else if (inp.widget) { /* widget converted to an input whose source is gone: keep the widget value */ }
        else delete inputs[name];
      }

      graph[id] = { class_type: n.type, inputs, _meta: { title: n.title || null } };
    }

    return { graph, notes, status };
  }

  // Nodes ComfyUI would actually execute: terminal active nodes and everything upstream of them.
  function executedSet(graph) {
    const consumed = new Set();
    for (const n of Object.values(graph)) {
      for (const v of Object.values(n.inputs)) if (Array.isArray(v) && v.length === 2) consumed.add(String(v[0]));
    }
    const executed = new Set();
    const stack = Object.keys(graph).filter(id => !consumed.has(id));
    while (stack.length) {
      const id = stack.pop();
      if (executed.has(id)) continue;
      executed.add(id);
      const n = graph[id];
      if (!n) continue;
      for (const v of Object.values(n.inputs)) if (Array.isArray(v) && v.length === 2) stack.push(String(v[0]));
    }
    return executed;
  }

  return { convert, executedSet };
})();

// ---- src/js/70-card.js ----
// Renders the generation card: prompts, parameters, models, other nodes.
App.card = (() => {
  const { h, clear, copyText } = App.util;

  // The "Final / Original" toggles and pass selection live inside the card,
  // so it can re-render itself.
  function render(record) {
    const card = record.card;
    const root = h('div', { class: 'card' });
    const view = { pass: 0, original: { positive: false, negative: false } };

    const draw = () => {
      clear(root);
      const pass = card.passes ? card.passes[view.pass] : null;
      // Pass prompt objects are created once and kept on the pass itself,
      // otherwise editor changes would be lost on every re-render.
      if (pass && !pass.prompts) pass.prompts = { positive: { text: pass.positive, original: null }, negative: { text: pass.negative, original: null } };
      const positive = pass ? pass.prompts.positive : card.positive;
      const negative = pass ? pass.prompts.negative : card.negative;
      const params = pass ? withModel(pass.params, card) : card.params;

      if (card.passes) root.append(passSwitcher(card.passes, view, draw));
      root.append(promptBlock('Prompt', positive, 'positive', view, draw));
      root.append(promptBlock('Negative', negative, 'negative', view, draw));

      // Parameters and Models in two columns on wide screens, stacked on narrow ones.
      const left = (params.length || card.extra.length) ? h('div', { class: 'split-col' },
        h('div', { class: 'block-title' }, 'Parameters'),
        params.length ? paramGrid(params) : null,
        card.extra.length ? extraTable(card.extra) : null) : null;
      const right = card.models.length ? h('div', { class: 'split-col' },
        h('div', { class: 'block-title' }, 'Models'),
        modelList(card.models)) : null;
      if (left || right) root.append(h('div', { class: `split${left && right ? '' : ' split-single'}` }, left, right));
      if (card.textNodes && card.textNodes.length) {
        root.append(h('div', { class: 'block-title' }, 'Other nodes'));
        root.append(nodeGroups(card.textNodes));
      }
    };
    draw();
    return root;
  }

  function withModel(params, card) {
    const checkpoint = card.models.find(m => m.role === 'checkpoint');
    return checkpoint ? [{ label: 'Model', value: checkpoint.name, sub: checkpoint.detail || null }, ...params] : params;
  }

  function passSwitcher(passes, view, redraw) {
    return h('div', { class: 'seg' },
      h('span', { class: 'seg-label' }, 'Sampler pass'),
      passes.map((p, i) => h('button', {
        class: `seg-btn${i === view.pass ? ' active' : ''}`,
        onClick: () => { view.pass = i; redraw(); },
      }, p.label)));
  }

  function promptBlock(label, prompt, kind, view, redraw) {
    const hasOriginal = prompt.original != null;
    const showOriginal = hasOriginal && view.original[kind];
    const field = showOriginal ? 'original' : 'text';

    const toggle = hasOriginal ? h('div', { class: 'seg seg-inline' },
      h('button', { class: `seg-btn${!showOriginal ? ' active' : ''}`, onClick: () => { view.original[kind] = false; redraw(); } }, 'Final'),
      h('button', { class: `seg-btn${showOriginal ? ' active' : ''}`, onClick: () => { view.original[kind] = true; redraw(); } }, 'Original')) : null;

    // Edits live in the prompt object until the page reloads; the original is kept
    // alongside so the Reset button can restore it.
    const pristine = prompt.pristine || (prompt.pristine = { text: prompt.text, original: prompt.original });
    const edited = () => prompt[field] !== pristine[field];

    const editedTag = h('span', { class: 'edited-tag', hidden: !edited() }, 'edited');
    const resetBtn = h('button', { class: 'btn btn-sm', title: 'Discard edits', hidden: !edited(),
      onClick: () => { prompt[field] = pristine[field]; redraw(); } }, App.icons.svg('x'), 'Reset');
    const copyBtn = h('button', { class: 'btn btn-sm', onClick: e => App.ui.flash(e.currentTarget, copyText(prompt[field])) }, App.icons.svg('copy'), 'Copy');
    // Text is read-only by default; the editor is enabled by a button and remembers its state.
    const editBtn = h('button', { class: `btn btn-sm${prompt.editing ? ' active' : ''}`, title: prompt.editing ? 'Finish editing' : 'Edit text',
      onClick: () => { prompt.editing = !prompt.editing; redraw(); } }, App.icons.svg(prompt.editing ? 'check' : 'pencil'), prompt.editing ? 'Done' : 'Edit');

    const body = prompt.editing
      ? promptEditor(prompt, field, () => { editedTag.hidden = !edited(); resetBtn.hidden = !edited(); })
      : (prompt[field] ? promptText(prompt[field]) : h('div', { class: 'prompt-empty' }, '(empty)'));

    return h('div', { class: `prompt-block prompt-${kind}${prompt.editing ? ' editing' : ''}` },
      h('div', { class: 'prompt-head' },
        h('span', { class: 'prompt-label' }, label),
        toggle,
        editedTag,
        h('span', { class: 'spacer' }),
        resetBtn,
        editBtn,
        copyBtn),
      body);
  }

  // Editor: a colorized <pre> sets the height and draws the highlighting; on top of it
  // sits a transparent textarea with the same font and padding. Cursor and selection
  // come from the textarea, colors from the pre; the pre is redrawn on input.
  function promptEditor(prompt, field, onChange) {
    const under = h('pre', { class: 'prompt-text prompt-under' });
    const input = h('textarea', { class: 'prompt-input', spellcheck: 'false', placeholder: '(empty)' });
    input.value = prompt[field] || '';

    const paint = () => {
      clear(under);
      const text = input.value;
      under.append(App.card.renderPromptText ? App.card.renderPromptText(text) : text);
      // A trailing newline adds no height in pre but does in textarea: even them out.
      if (text.endsWith('\n') || text === '') under.append('\u200b');
    };
    input.addEventListener('input', () => {
      prompt[field] = input.value;
      paint();
      onChange();
    });
    paint();
    // Move the cursor to the end of the text right after enabling the editor.
    setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
    return h('div', { class: 'prompt-edit' }, under, input);
  }

  // Syntax highlighting is plugged in at stage three via App.card.renderPromptText.
  function promptText(text) {
    return h('pre', { class: 'prompt-text' }, App.card.renderPromptText ? App.card.renderPromptText(text) : text);
  }

  // Short numbers fit in half the card; everything else gets the normal width.
  const NARROW = new Set(['CFG', 'Steps', 'Clip skip']);
  function paramWidth(label) {
    return NARROW.has(label) ? ' param-narrow' : '';
  }

  function paramGrid(params) {
    return h('div', { class: 'param-grid' }, params.map(p =>
      h('div', { class: `param${paramWidth(p.label)}`, title: p.sub ? `${p.value} ${p.sub}` : p.value },
        h('div', { class: 'param-label' }, p.label),
        // A suffix like "× 2" on the same line; the name gets truncated, the suffix is always visible.
        h('div', { class: 'param-value' },
          h('span', { class: 'param-main' }, p.value),
          p.sub ? h('span', { class: 'param-sub' }, p.sub) : null),
        h('button', { class: 'hover-copy', title: 'Copy value', onClick: e => flashIcon(e.currentTarget, copyText(p.value)) }, App.icons.svg('copy')))));
  }

  // The button icon turns into a checkmark for a second.
  async function flashIcon(button, promise) {
    const ok = await promise;
    clear(button);
    button.append(App.icons.svg(ok ? 'check' : 'x'));
    setTimeout(() => { clear(button); button.append(App.icons.svg('copy')); }, 1200);
  }

  function modelList(models) {
    return h('div', { class: 'models' },
      models.map(m => h('div', { class: 'model-row' },
        h('span', { class: `role role-${m.role}` }, m.role),
        h('span', { class: 'model-name', title: m.name }, m.name),
        m.weight != null ? h('span', { class: 'model-weight' }, `× ${m.weight}`) : null,
        m.detail ? h('span', { class: 'model-weight' }, m.detail) : null,
        m.hash ? h('span', { class: 'model-hash', title: m.hash }, String(m.hash)) : null)));
  }

  // Other graph nodes in three collapsible groups: used in generation,
  // not connected to a sampler, canvas notes.
  const GROUPS = [
    { kind: 'used', title: 'Feeding samplers', open: false, hint: 'every string input reachable from a sampler, positive and negative included' },
    { kind: 'unused', title: 'Not connected', open: false, hint: 'text nodes on the canvas that no sampler reads' },
    { kind: 'note', title: 'Canvas notes', open: false, hint: 'Note and MarkdownNote nodes, never part of generation' },
  ];

  function nodeGroups(nodes) {
    return h('div', { class: 'sections' }, GROUPS.map(g => {
      const items = nodes.filter(n => (n.kind || 'used') === g.kind);
      if (items.length === 0) return null;
      return h('details', { class: 'sec sec-flat', open: g.open },
        h('summary', { class: 'sec-head' },
          h('span', { class: 'sec-key' }, g.title),
          h('span', { class: 'sec-meta' }, `${items.length} · ${g.hint}`)),
        h('div', { class: 'sec-body' }, nodeTabs(items)));
    }));
  }

  function nodeTabs(nodes) {
    let active = 0;
    const body = h('div');
    const strip = h('div', { class: 'tabs' });
    const draw = () => {
      clear(strip);
      nodes.forEach((n, i) => strip.append(h('button', {
        class: `tab${i === active ? ' active' : ''}`,
        title: `${n.classType} · ${n.field}`,
        onClick: () => { active = i; draw(); },
      }, `#${n.id} ${n.title || n.classType}`, App.privacy.isSensitive(null, n.text) ? App.icons.svg('lock', 'tab-lock') : null)));
      clear(body);
      body.append(promptText(nodes[active].text));
    };
    draw();
    return [strip, body];
  }

  function extraTable(extra) {
    return h('details', { class: 'sec sec-flat' },
      h('summary', { class: 'sec-head' },
        h('span', { class: 'sec-key' }, 'Other parameters'),
        h('span', { class: 'sec-meta' }, `${extra.length} values`)),
      h('div', { class: 'sec-body' },
        h('table', { class: 'kv' }, extra.map(e => h('tr',
          h('td', { class: 'kv-key' }, e.key),
          h('td', { class: 'kv-val' }, e.value, App.privacy.isSensitive(e.key, e.value) ? App.privacy.badge() : null))))));
  }

  return { render };
})();

// ---- src/js/75-prompt-syntax.js ----
// Prompt syntax tokenizer. One shared scheme for A1111, ComfyUI and SwarmUI,
// not tied to any generator. Separate from rendering: tokenize() returns a list of
// { type, text, alt } and knows nothing about the DOM.
//
// Token types:
//   text      plain text
//   tag       angle-bracket tags: <lora:...>, <segment:...>, <weight[1.2]:...>, opening and closing parts
//   tagname   tag name together with its [parameter] and colon
//   brace     { } of choice blocks
//   sep       alternative separator: | inside {}, | or , inside <random:...>
//   paren     ( ) of emphasis
//   bracket   [ ] of de-emphasis, alternation and scheduling
//   weight    weight number: :1.2 before a closing bracket or in <lora:name:0.8>
//   break     the word BREAK
//   wildcard  __name__
//   embedding embedding:name
//   escape    escaped brackets \( \)
//   comment   # to end of line, only at the start of a line
// For tokens inside a choice block, the alt field alternates 0/1 per alternative.
App.promptSyntax = (() => {
  const TAG_OPEN = /^<([a-zA-Z_][\w-]*)(\[[^\]<>]*\])?(:|>)/;
  const WEIGHT_TAIL = /:\s*-?\d*\.?\d+\s*$/;
  const RANDOM_TAGS = new Set(['random', 'wildcard', 'alternate', 'fromto']);

  function tokenize(text) {
    const tokens = [];
    const stack = [];   // contexts: { kind, sep, alt, name }
    let buf = '';
    let i = 0;
    let lineStart = true;

    const top = () => stack[stack.length - 1] || null;
    const altOf = () => { const t = top(); return t && t.sep ? t.alt : null; };
    const push = (type, s) => { if (s) tokens.push({ type, text: s, alt: altOf() }); };
    const flush = () => { if (buf) { splitText(buf, altOf(), tokens); buf = ''; } };

    // Split a trailing weight number off the buffer text: "(fur:1.2)" -> text "fur", weight ":1.2".
    const flushWithWeight = () => {
      const m = WEIGHT_TAIL.exec(buf);
      if (m) {
        const head = buf.slice(0, m.index);
        buf = head;
        flush();
        tokens.push({ type: 'weight', text: m[0], alt: altOf() });
      } else {
        flush();
      }
    };

    // For <random:...> the separator depends on the content: | if present, otherwise a comma.
    const randomSeparator = (from) => {
      let depth = 0;
      for (let j = from; j < text.length; j++) {
        const c = text[j];
        if (c === '<') depth++;
        else if (c === '>') { if (depth === 0) return text.slice(from, j).includes('|') ? '|' : ','; depth--; }
      }
      return '|';
    };

    while (i < text.length) {
      const c = text[i];
      const next = text[i + 1];

      if (c === '\\' && next && '()[]{}<>\\'.includes(next)) {
        flush(); push('escape', c + next); i += 2; lineStart = false; continue;
      }

      if (c === '#' && lineStart) {
        flush();
        let j = text.indexOf('\n', i);
        if (j < 0) j = text.length;
        push('comment', text.slice(i, j));
        i = j;
        continue;
      }

      if (c === '<') {
        const m = TAG_OPEN.exec(text.slice(i));
        if (m) {
          flush();
          const name = m[1].toLowerCase();
          push('tag', '<');
          push('tagname', m[0].slice(1));
          if (m[3] === '>') {
            // A tag without content, like <clear> or <break>.
            tokens.pop(); tokens.pop();
            push('tag', m[0]);
          } else {
            stack.push({ kind: 'tag', name, sep: RANDOM_TAGS.has(name) ? randomSeparator(i + m[0].length) : null, alt: 0 });
          }
          i += m[0].length; lineStart = false; continue;
        }
      }
      if (c === '>' && top() && top().kind === 'tag') {
        flushWithWeight(); stack.pop(); push('tag', '>'); i++; lineStart = false; continue;
      }

      if (c === '{') { flush(); stack.push({ kind: 'brace', sep: '|', alt: 0 }); push('brace', c); i++; lineStart = false; continue; }
      if (c === '}' && top() && top().kind === 'brace') { flush(); stack.pop(); push('brace', c); i++; lineStart = false; continue; }

      if (c === '(') { flush(); stack.push({ kind: 'paren', sep: null, alt: 0 }); push('paren', c); i++; lineStart = false; continue; }
      if (c === ')' && top() && top().kind === 'paren') { flushWithWeight(); stack.pop(); push('paren', c); i++; lineStart = false; continue; }

      if (c === '[') { flush(); stack.push({ kind: 'bracket', sep: '|', alt: 0 }); push('bracket', c); i++; lineStart = false; continue; }
      if (c === ']' && top() && top().kind === 'bracket') { flushWithWeight(); stack.pop(); push('bracket', c); i++; lineStart = false; continue; }

      const ctx = top();
      if (ctx && ctx.sep && c === ctx.sep) {
        flush(); push('sep', c); ctx.alt++; i++; lineStart = false; continue;
      }

      buf += c;
      lineStart = c === '\n' || (lineStart && (c === ' ' || c === '\t'));
      i++;
    }
    flush();
    return tokens;
  }

  // Within plain text, pick out BREAK, __wildcard__ and embedding:name.
  const INLINE = /(\bBREAK\b|__[\w\-./ ]+__|\bembedding:[\w\-.]+)/g;
  function splitText(s, alt, out) {
    let last = 0;
    for (const m of s.matchAll(INLINE)) {
      if (m.index > last) out.push({ type: 'text', text: s.slice(last, m.index), alt });
      const t = m[0];
      out.push({ type: t === 'BREAK' ? 'break' : t.startsWith('__') ? 'wildcard' : 'embedding', text: t, alt });
      last = m.index + t.length;
    }
    if (last < s.length) out.push({ type: 'text', text: s.slice(last), alt });
  }

  return { tokenize };
})();

// Highlight rendering: a fragment with a <span class="ps-..."> per token.
// The toggle is global and lasts until the page reloads.
App.card.renderPromptText = function renderPromptText(text) {
  if (!App.settings.highlight) return document.createTextNode(text);
  const frag = document.createDocumentFragment();
  for (const t of App.promptSyntax.tokenize(text)) {
    if (t.type === 'text' && t.alt === null) { frag.append(document.createTextNode(t.text)); continue; }
    const span = document.createElement('span');
    span.className = `ps-${t.type}${t.alt !== null ? ` ps-alt-${t.alt % 2}` : ''}`;
    span.textContent = t.text;
    frag.append(span);
  }
  return frag;
};

// ---- src/js/90-app.js ----
// Entry point: drag-and-drop over the whole window, adding files, clearing.
App.app = (() => {
  const { state } = App.ui;

  async function addFiles(fileList) {
    const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/') || /\.(png|jpe?g|webp)$/i.test(f.name));
    if (files.length === 0) return;
    const firstNew = state.files.length;
    for (const file of files) {
      state.files.push(await App.source.readFile(file));
    }
    state.selected = firstNew;
    App.ui.render();
  }

  function removeFile(index) {
    const [rec] = state.files.splice(index, 1);
    if (rec) URL.revokeObjectURL(rec.url);
    if (state.selected >= state.files.length) state.selected = state.files.length - 1;
    else if (state.selected > index) state.selected--;
    App.ui.render();
  }

  // Keep only the opened file.
  function clearOthers() {
    const keep = state.files[state.selected];
    state.files.forEach(r => { if (r !== keep) URL.revokeObjectURL(r.url); });
    state.files.length = 0;
    if (keep) state.files.push(keep);
    state.selected = keep ? 0 : -1;
    App.ui.render();
  }

  function clearAll() {
    state.files.forEach(r => URL.revokeObjectURL(r.url));
    state.files.length = 0;
    state.selected = -1;
    App.ui.render();
  }

  function initDragDrop() {
    let depth = 0;
    window.addEventListener('dragenter', e => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
    window.addEventListener('dragleave', e => { e.preventDefault(); if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
    window.addEventListener('dragover', e => { e.preventDefault(); });
    window.addEventListener('drop', e => {
      e.preventDefault();
      depth = 0;
      document.body.classList.remove('dragging');
      addFiles(e.dataTransfer.files);
    });
  }

  function init() {
    App.ui.mount(document.getElementById('app'));
    initDragDrop();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { addFiles, removeFile, clearOthers, clearAll };
})();

</script>
