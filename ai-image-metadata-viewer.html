<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Image Metadata Viewer</title>
<style>
/* Theme tokens. Light by default, dark via prefers-color-scheme,
   an explicit choice via html[data-theme] overrides the system setting. */
:root {
  --bg: #f4f5f8;
  --bg-panel: #ffffff;
  --bg-elevated: #eceef3;
  --border: #d9dce4;
  --text: #1a1c23;
  --text-muted: #6f7180;
  --accent: #1fa39b;
  --accent-soft: rgba(31, 163, 155, 0.14);
  --purple: #6f56d6;
  --amber: #c98a1a;
  --red: #d8463a;
  --json-key: #6f56d6;
  --json-string: #1f7a4d;
  --json-number: #b35a00;
  --json-bool: #c2185b;
  --json-null: #8a8d99;
  --ps-tag: #1fa39b;
  --ps-paren: #c98a1a;
  --ps-brace: #6f56d6;
  --ps-break: #d8463a;
  --ps-alt-0: rgba(111, 86, 214, 0.10);
  --ps-alt-1: rgba(31, 163, 155, 0.12);
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0d;
    --bg-panel: #14151b;
    --bg-elevated: #1c1d25;
    --border: #23252f;
    --text: #f2f3f7;
    --text-muted: #9294a3;
    --accent: #4fd8d0;
    --accent-soft: rgba(79, 216, 208, 0.12);
    --purple: #9b7ef5;
    --amber: #f5b84e;
    --red: #f2665b;
    --json-key: #9b7ef5;
    --json-string: #67e0d8;
    --json-number: #f5b84e;
    --json-bool: #f28fb0;
    --json-null: #6f7180;
    --ps-tag: #4fd8d0;
    --ps-paren: #f5b84e;
    --ps-brace: #9b7ef5;
    --ps-break: #f2665b;
    --ps-alt-0: rgba(155, 126, 245, 0.16);
    --ps-alt-1: rgba(79, 216, 208, 0.14);
  }
}

:root[data-theme="dark"] {
  --bg: #0a0a0d;
  --bg-panel: #14151b;
  --bg-elevated: #1c1d25;
  --border: #23252f;
  --text: #f2f3f7;
  --text-muted: #9294a3;
  --accent: #4fd8d0;
  --accent-soft: rgba(79, 216, 208, 0.12);
  --purple: #9b7ef5;
  --amber: #f5b84e;
  --red: #f2665b;
  --json-key: #9b7ef5;
  --json-string: #67e0d8;
  --json-number: #f5b84e;
  --json-bool: #f28fb0;
  --json-null: #6f7180;
  --ps-tag: #4fd8d0;
  --ps-paren: #f5b84e;
  --ps-brace: #9b7ef5;
  --ps-break: #f2665b;
  --ps-alt-0: rgba(155, 126, 245, 0.16);
  --ps-alt-1: rgba(79, 216, 208, 0.14);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
}

body.dragging::after {
  content: "Drop to open";
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 24px;
  color: var(--accent);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  border: 3px dashed var(--accent);
  pointer-events: none;
  z-index: 10;
}

code, pre, .mono { font-family: var(--mono); }

button.btn {
  font: inherit;
  color: var(--text);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  cursor: pointer;
}
button.btn:hover { border-color: var(--accent); }
button.btn-ghost { background: transparent; }
button.btn-sm { padding: 2px 8px; font-size: 12px; }

/* Layout skeleton */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
}
.brand {
  font: inherit;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--text);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.brand:hover { color: var(--accent); }
.topbar-actions { display: flex; gap: 8px; }

.app {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
}

.left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.right { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

/* Left column */
.dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: border-color 0.15s;
}
.dropzone:hover { border-color: var(--accent); }
.dz-title { font-size: 16px; color: var(--text); }
.dz-sub { font-size: 12px; margin-top: 4px; }
.has-files .dropzone { padding: 10px; }
.has-files .dz-title { font-size: 13px; }
.has-files .dz-sub { display: none; }

.filelist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filelist-head { display: flex; align-items: center; gap: 8px; }
.filelist-head .block-title { margin: 0; }
.single-file .filelist, .single-file .filelist-head, #app:not(.has-files) .filelist, #app:not(.has-files) .filelist-head { display: none; }
.fileitem {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 6px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
}
.fileitem:hover { background: var(--bg-elevated); }
.fileitem.active { border-color: var(--accent); background: var(--accent-soft); }
.fileitem img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); background: var(--bg-elevated); flex: none; }
.fileitem-text { min-width: 0; flex: 1; }
.fileitem-remove {
  flex: none;
  display: none;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}
.fileitem:hover .fileitem-remove { display: inline-flex; }
.fileitem-remove:hover { color: var(--red); background: var(--bg-panel); }
.fileitem-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fileitem-sub { font-size: 12px; color: var(--text-muted); }

.preview img {
  display: block;
  cursor: zoom-in;
  max-width: 100%;
  max-height: 60vh;
  margin: 0 auto;
  border-radius: var(--radius);
  background: var(--bg-elevated);
}
.fileinfo:empty { display: none; }
.fileinfo {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
}
.info-row { display: flex; gap: 8px; padding: 2px 0; }
.info-label { color: var(--text-muted); flex: none; width: 56px; }
.info-value { word-break: break-all; }

/* Right column */
.empty {
  color: var(--text-muted);
  padding: 40px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
}

.genbadge {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 12px;
  padding: 10px 14px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
}
.genbadge.gen-unknown, .genbadge.gen-none { border-left-color: var(--amber); }
.gen-name { font-weight: 600; font-size: 15px; }
.gen-detail { color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
.gen-keys { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.gen-keys code {
  font-size: 12px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.warnings { display: flex; flex-direction: column; gap: 4px; }
.warning {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--amber) 14%, transparent);
  color: var(--text);
  border-left: 3px solid var(--amber);
  font-size: 13px;
}

.sections { display: flex; flex-direction: column; gap: 10px; }
.sec {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.sec-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.sec-head::-webkit-details-marker { display: none; }
.sec-head::before {
  content: "";
  width: 0; height: 0;
  border-left: 5px solid var(--text-muted);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform 0.12s;
  flex: none;
}
.sec[open] > .sec-head::before { transform: rotate(90deg); }
.sec-key { font-family: var(--mono); font-weight: 600; }
.sec-meta { color: var(--text-muted); font-size: 12px; }
.sec-actions { margin-left: auto; display: flex; gap: 6px; }
.sec-body { border-top: 1px solid var(--border); padding: 8px 12px; overflow-x: auto; }

pre.rawtext {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.5;
}

/* JSON tree */
.jt-root { font-family: var(--mono); font-size: 13px; line-height: 1.55; }
.jt { margin: 0; }
.jt-body { padding-left: 18px; border-left: 1px solid var(--border); margin-left: 5px; }
.jt-sum { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.jt-sum::-webkit-details-marker { display: none; }
.jt-sum::before {
  content: "";
  align-self: center;
  width: 0; height: 0;
  border-left: 5px solid var(--text-muted);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform 0.12s;
  flex: none;
}
.jt[open] > .jt-sum::before { transform: rotate(90deg); }
.jt-sum > .jt-key, .jt-sum > .jt-colon { margin-left: -6px; }
.jt-sum > .jt-key { margin-left: 0; }
.jt-row { padding-left: 11px; white-space: pre-wrap; word-break: break-word; }
.jt-key { color: var(--json-key); }
.jt-colon { color: var(--text-muted); }
.jt-brace { color: var(--text-muted); }
.jt-count { color: var(--text-muted); font-size: 11px; }
.jt-hint { color: var(--accent); font-size: 12px; }
.jt[open] > .jt-sum > .jt-count, .jt[open] > .jt-sum > .jt-hint, .jt[open] > .jt-sum > .jt-close { display: none; }
.jt-string { color: var(--json-string); }
.jt-number { color: var(--json-number); }
.jt-boolean { color: var(--json-bool); }
.jt-null, .jt-undefined { color: var(--json-null); }

/* Generation card */
.card { display: flex; flex-direction: column; gap: 10px; }
.block-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 6px 0 2px; }
.spacer { flex: 1; }

.prompt-block {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.prompt-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
.prompt-label { font-weight: 600; }
.prompt-negative .prompt-label { color: var(--red); }
.prompt-text {
  margin: 0;
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.55;
  max-height: 40vh;
  overflow: auto;
}

.seg { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.seg-label { font-size: 12px; color: var(--text-muted); margin-right: 6px; }
.seg-btn {
  font: inherit;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 2px 10px;
  cursor: pointer;
}
.seg-btn:first-of-type { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.seg-btn:last-of-type { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.seg-btn + .seg-btn { margin-left: -1px; }
.seg-btn.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); position: relative; z-index: 1; }
.seg-inline .seg-btn { padding: 1px 8px; }

.param-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-flow: dense;
  gap: 8px;
}
.param { grid-column: span 2; position: relative; }
.hover-copy {
  position: absolute;
  top: 6px;
  right: 6px;
  display: none;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
}
.hover-copy .icon { width: 13px; height: 13px; }
.param:hover .hover-copy { display: inline-flex; }
.hover-copy:hover { color: var(--accent); }
.param-narrow { grid-column: span 1; }

/* Parameters and Models side by side on a wide screen */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.split-single { grid-template-columns: 1fr; }
.split-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.split-col .block-title { margin-top: 6px; }
@media (max-width: 1180px) {
  .split { grid-template-columns: 1fr; }
  .param-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .param-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
.param {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  min-width: 0;
}
.param-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.param-value { display: flex; align-items: baseline; gap: 6px; font-family: var(--mono); font-size: 13px; margin-top: 2px; min-width: 0; }
.param-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.param-narrow { padding-left: 8px; padding-right: 6px; }
.param-narrow .param-label { font-size: 10px; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.param-sub { flex: none; font-size: 12px; color: var(--text-muted); }

.models { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; }
.model-row { display: flex; align-items: center; gap: 12px; padding: 3px 0; font-size: 13px; min-width: 0; }
.model-name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-weight { color: var(--text-muted); font-family: var(--mono); flex: none; }
.model-hash { margin-left: auto; color: var(--text-muted); font-family: var(--mono); font-size: 12px; flex: none; max-width: 11ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role {
  flex: none;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg-elevated);
  color: var(--text-muted);
  width: 92px;
  text-align: center;
  padding-top: 3px;
  padding-bottom: 3px;
}
.role-checkpoint { color: var(--accent); }
.role-lora { color: var(--purple); }
.role-vae, .role-refiner, .role-upscaler { color: var(--amber); }

.sec-flat .sec-body { padding: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.tab {
  font: inherit;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  cursor: pointer;
}
.tab.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
table.kv td { padding: 4px 12px; border-top: 1px solid var(--border); vertical-align: top; }
table.kv tr:first-child td { border-top: 0; }
.kv-key { font-family: var(--mono); color: var(--json-key); white-space: nowrap; width: 1%; }
.kv-val { font-family: var(--mono); word-break: break-word; }

.jt-deco { font-size: 11px; color: var(--amber); }
.jt-unused > .jt-sum { opacity: 0.6; }

.tab-unused, .tab-note { opacity: 0.7; }
.tab-tag { margin-left: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--amber); }
.tab-note .tab-tag { color: var(--text-muted); }

/* Enlarged image view */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(0, 0, 0, 0.82);
  cursor: zoom-out;
  padding: 24px;
}
.lightbox img {
  max-width: 100%;
  max-height: calc(100vh - 80px);
  object-fit: contain;
  border-radius: var(--radius);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
}
.lightbox-caption { color: #f2f3f7; font-size: 13px; opacity: 0.85; font-family: var(--mono); }

/* Icons from the Lucide sprite */
.icon {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -3px;
  flex: none;
}
button.btn { display: inline-flex; align-items: center; gap: 6px; }
button.btn-sm .icon { width: 14px; height: 14px; }
button.btn-icon { padding: 6px; }
button.btn-icon.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.topbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.dz-title .icon { width: 18px; height: 18px; color: var(--accent); }
.tab-lock { width: 12px; height: 12px; margin-left: 6px; color: var(--amber); }

/* Private label */
.private {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 8px;
  padding: 0 6px;
  border-radius: 4px;
  font-family: var(--sans);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--amber);
  background: color-mix(in srgb, var(--amber) 16%, transparent);
  vertical-align: 1px;
  cursor: help;
}
.private .icon { width: 10px; height: 10px; }

/* Prompt syntax highlighting */
.ps-tag, .ps-tagname { color: var(--ps-tag); }
.ps-tagname { font-weight: 600; }
.ps-paren, .ps-bracket, .ps-weight { color: var(--ps-paren); }
.ps-weight { font-weight: 600; }
.ps-brace, .ps-sep { color: var(--ps-brace); font-weight: 600; }
.ps-break { color: var(--ps-break); font-weight: 700; }
.ps-wildcard, .ps-embedding { color: var(--ps-brace); }
.ps-comment { color: var(--text-muted); font-style: italic; }
.ps-escape { color: var(--text-muted); }
.ps-alt-0 { background: var(--ps-alt-0); border-radius: 2px; }
.ps-alt-1 { background: var(--ps-alt-1); border-radius: 2px; }
.ps-sep.ps-alt-0, .ps-sep.ps-alt-1, .ps-brace.ps-alt-0, .ps-brace.ps-alt-1, .ps-tag.ps-alt-0, .ps-tag.ps-alt-1, .ps-tagname.ps-alt-0, .ps-tagname.ps-alt-1 { background: none; }

/* Parser notes: paler than warnings */
.note {
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  border-left: 3px solid var(--border);
  background: var(--bg-panel);
  font-size: 12px;
}

/* Prompt editor */
.prompt-edit { position: relative; max-height: 40vh; overflow: auto; }
.prompt-under { max-height: none; overflow: visible; min-height: 38px; }
.prompt-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 10px 12px;
  border: 0;
  outline: none;
  resize: none;
  overflow: hidden;
  background: transparent;
  color: transparent;
  caret-color: var(--text);
  font: inherit;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  box-sizing: border-box;
}
.prompt-input::placeholder { color: var(--text-muted); }

// ---- src/js/00-util.js ----
// Shared utilities: DOM building, formatting, clipboard.
// All modules live in a single App namespace because the scripts
// are loaded as classic <script> tags without modules or a bundler.
window.App = window.App || {};

App.util = (() => {
  // h('div', { class: 'x', onClick: fn }, ...children) — a small DOM helper.
  // on* attributes are attached as event handlers, boolean true yields an empty attribute,
  // null/false are skipped. Children: nodes, strings, numbers, nested arrays.
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs)) {
      for (const [name, value] of Object.entries(attrs)) {
        if (value == null || value === false) continue;
        if (name.startsWith('on') && typeof value === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), value);
        } else if (name === 'dataset') {
          Object.assign(el.dataset, value);
        } else {
          el.setAttribute(name, value === true ? '' : value);
        }
      }
    } else if (attrs != null) {
      children.unshift(attrs);
    }
    append(el, children);
    return el;
  }

  function append(el, children) {
    for (const child of children.flat(Infinity)) {
      if (child == null || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  function formatBytes(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(2)} MB`;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // From file:// the clipboard API is sometimes unavailable; fall back to a textarea.
      const ta = h('textarea', { style: 'position:fixed;opacity:0' }, text);
      document.body.append(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  // Downloads a string as a file. This is the only "write" inside the app,
  // and it never touches the source image.
  function downloadText(name, text, mime = 'application/json') {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = h('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Exception-free JSON parsing: returns null if the string is not JSON.
  function tryParseJson(text) {
    if (typeof text !== 'string') return null;
    const s = text.trim();
    if (!(s.startsWith('{') || s.startsWith('['))) return null;
    try { return JSON.parse(s); } catch (_) { /* try to repair below */ }
    // Python writes NaN and Infinity unquoted, JSON.parse fails on them.
    const fixed = s.replace(/(:\s*)(-?Infinity|NaN)(?=\s*[,}\]])/g, '$1null');
    if (fixed === s) return null;
    try { return JSON.parse(fixed); } catch (_) { return null; }
  }

  return { h, append, clear, formatBytes, copyText, downloadText, tryParseJson };
})();

// The "private" badge: values that leave together with the image and are
// usually not expected there: absolute paths with a user name, personal notes.
// The app strips nothing, it only shows.

  const VALUE_PATTERNS = [

    /[\\/](Users|home)[\\/][^\\/\s]+/, // /home/alice, C:\Users\alice, /Users/alice
    /^\/(mnt|media|Volumes)\/[^/]+\//, // mounted drives
    /^~\//,                            // home directory
    /\\\\[^\\]+\\/,                    // network paths \\server\share
  ];

  function isSensitive(key, value) {
    if (typeof value !== 'string' || value.trim() === '') return false;
    if (key != null && KEY_PATTERNS.some(re => re.test(String(key)))) return true;

      App.icons.svg('lock'), 'private');

// ---- src/js/10-png.js ----
// Reading PNG text chunks: tEXt, zTXt, iTXt.
// Knows nothing about generators, only extracts key/value pairs and dimensions.
App.png = (() => {
  const SIGNATURE = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
  const latin1 = new TextDecoder('latin1');
  const utf8 = new TextDecoder('utf-8');

  function isPng(bytes) {
    return bytes.length >= 8 && SIGNATURE.every((b, i) => bytes[i] === b);
  }

  // Chunk generator: { type, data }. Stops at IEND.
  function* chunks(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let offset = 8;
    while (offset + 12 <= bytes.length) {
      const length = view.getUint32(offset);
      const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
      if (offset + 12 + length > bytes.length) {
        throw new Error(`Chunk ${type} at offset ${offset} exceeds file size`);
      }
      yield { type, data: bytes.subarray(offset + 8, offset + 8 + length) };
      offset += 12 + length;
      if (type === 'IEND') break;
    }
  }

  // A zlib stream (RFC 1950) is inflated with the native DecompressionStream('deflate').
  async function inflate(data) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('DecompressionStream is not available in this browser');
    }
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // Reads bytes up to NUL starting at from. Returns [slice, position after NUL].
  function readUntilNul(data, from) {
    const end = data.indexOf(0, from);
    if (end < 0) throw new Error('missing NUL separator');
    return [data.subarray(from, end), end + 1];
  }

  async function decodeText(chunk) {
    const { type, data } = chunk;
    let [keyBytes, pos] = readUntilNul(data, 0);
    const key = latin1.decode(keyBytes);

    if (type === 'tEXt') {
      // Latin-1 per the spec, but generators write UTF-8 there (SwarmUI, ComfyUI),
      // so we decode as UTF-8: for pure ASCII the result is the same.
      return { key, value: utf8.decode(data.subarray(pos)), chunkType: type, compressed: false };
    }

    if (type === 'zTXt') {
      const method = data[pos];
      if (method !== 0) throw new Error(`unsupported zTXt compression method ${method}`);
      const raw = await inflate(data.subarray(pos + 1));
      return { key, value: utf8.decode(raw), chunkType: type, compressed: true };
    }

    if (type === 'iTXt') {
      const compressed = data[pos] === 1;
      const method = data[pos + 1];
      pos += 2;
      let langBytes, translatedBytes;
      [langBytes, pos] = readUntilNul(data, pos);
      [translatedBytes, pos] = readUntilNul(data, pos);
      let payload = data.subarray(pos);
      if (compressed) {
        if (method !== 0) throw new Error(`unsupported iTXt compression method ${method}`);
        payload = await inflate(payload);
      }
      return {
        key,
        value: utf8.decode(payload),
        chunkType: type,
        compressed,
        language: latin1.decode(langBytes) || null,
        translatedKey: utf8.decode(translatedBytes) || null,
      };
    }

    throw new Error(`not a text chunk: ${type}`);
  }

  // Main entry point: dimensions from IHDR and the list of text entries.
  // Errors in individual chunks do not abort parsing, they go to warnings.
  async function read(bytes) {
    const result = { width: null, height: null, bitDepth: null, colorType: null, entries: [], warnings: [] };
    for (const chunk of chunks(bytes)) {
      if (chunk.type === 'IHDR') {
        const view = new DataView(chunk.data.buffer, chunk.data.byteOffset, chunk.data.byteLength);
        result.width = view.getUint32(0);
        result.height = view.getUint32(4);
        result.bitDepth = chunk.data[8];
        result.colorType = chunk.data[9];
        continue;
      }
      if (chunk.type !== 'tEXt' && chunk.type !== 'zTXt' && chunk.type !== 'iTXt') continue;
      try {
        result.entries.push(await decodeText(chunk));
      } catch (e) {
        result.warnings.push(`Failed to read ${chunk.type} chunk: ${e.message}`);
      }
    }
    return result;
  }

  return { isPng, read };
})();

// ---- src/js/20-source.js ----
// The "metadata source" layer: turns a File into a unified record
// regardless of the container. PNG only for now; EXIF/XMP for JPEG and WebP
// get added here as well, without touching the detector or generator parsers.
App.source = (() => {
  function sniffFormat(bytes) {
    if (App.png.isPng(bytes)) return 'png';
    if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'jpeg';
    if (bytes.length > 12 && String.fromCharCode(...bytes.subarray(0, 4)) === 'RIFF'
      && String.fromCharCode(...bytes.subarray(8, 12)) === 'WEBP') return 'webp';
    if (String.fromCharCode(...bytes.subarray(0, 3)) === 'GIF') return 'gif';
    return 'unknown';
  }

  // Image record:
  //   entries: [{ key, value, source, chunkType, json }] — json = parsed value or null
  //   warnings: human-readable parsing problems
  async function readFile(file) {
    const record = {
      id: `${file.name}:${file.size}:${file.lastModified}`,
      name: file.name,
      size: file.size,
      url: URL.createObjectURL(file),
      format: null,
      width: null,
      height: null,
      entries: [],
      warnings: [],   // file reading problems, shown prominently
      notes: [],      // parser remarks, shown dimmed
      generator: null,
      card: null,
    };

    let bytes;
    try {
      bytes = new Uint8Array(await file.arrayBuffer());
    } catch (e) {
      record.format = 'unknown';
      record.warnings.push(`Cannot read file: ${e.message}`);
      return record;
    }

    record.format = sniffFormat(bytes);

    if (record.format === 'png') {
      try {
        const png = await App.png.read(bytes);
        record.width = png.width;
        record.height = png.height;
        record.warnings.push(...png.warnings);
        record.entries = png.entries.map(e => ({
          key: e.key,
          value: e.value,
          source: `PNG ${e.chunkType}${e.compressed ? ' (compressed)' : ''}`,
          chunkType: e.chunkType,
          json: App.util.tryParseJson(e.value),
        }));
      } catch (e) {
        record.warnings.push(`PNG parse error: ${e.message}`);
      }
    } else if (record.format === 'jpeg' || record.format === 'webp') {
      record.warnings.push(`${record.format.toUpperCase()} metadata (EXIF UserComment) is not supported yet, PNG only for now`);
    } else {
      record.warnings.push('Unsupported file format');
    }

    record.generator = App.detect.detect(record);
    record.card = App.parsers.parse(record);
    if (record.card) record.notes.push(...record.card.notes);
    return record;
  }

  return { readFile, sniffFormat };
})();

// ---- src/js/30-detect.js ----
// Detecting the generator by the set of keys and their content.
// The order of checks matters: SwarmUI and Fooocus also write to parameters,
// ComfyUI via Swarm writes prompt/workflow next to parameters.
App.detect = (() => {
  function gen(id, name, keys, detail) {
    return { id, name, keys, detail: detail || null };
  }

  // ComfyUI API graph: an object whose values have class_type and inputs.
  function isComfyApiGraph(json) {
    if (!json || typeof json !== 'object' || Array.isArray(json)) return false;
    const values = Object.values(json);
    return values.length > 0 && values.some(n => n && typeof n === 'object' && 'class_type' in n && 'inputs' in n);
  }

  // ComfyUI UI graph: nodes[] and links[].
  function isComfyWorkflow(json) {
    return !!json && typeof json === 'object' && Array.isArray(json.nodes) && Array.isArray(json.links);
  }

  // A1111 string: has a parameter block like "Steps: 20, Sampler: ...".
  function isA1111Text(text) {
    return typeof text === 'string' && /(^|\n)Steps:\s*\d+/.test(text);
  }

  function a1111Flavor(text) {
    const m = /Version:\s*([^,\n]+)/.exec(text);
    if (!m) return { name: 'A1111 / Forge', detail: null };
    const v = m[1].trim();
    if (/^f\d/.test(v)) return { name: 'Forge', detail: v };
    if (/^v?\d/.test(v)) return { name: 'AUTOMATIC1111', detail: v };
    return { name: 'A1111-compatible', detail: v };
  }

  // The ComfyUI frontend version lives in workflow.extra.frontendVersion; the backend version is not in the file.
  function comfyVersion(workflowEntry) {
    const extra = workflowEntry && workflowEntry.json && workflowEntry.json.extra;
    return extra && extra.frontendVersion ? `frontend ${extra.frontendVersion}` : null;
  }

  function detect(record) {
    const byKey = Object.fromEntries(record.entries.map(e => [e.key, e]));
    const has = k => k in byKey;
    const keysOf = (...ks) => ks.filter(has);
    const params = byKey.parameters;

    if (params && params.json && params.json.sui_image_params) {
      return gen('swarmui', 'SwarmUI', keysOf('parameters', 'prompt', 'workflow'), params.json.sui_image_params.swarm_version);
    }

    if (has('invokeai_metadata') || has('invokeai_graph') || has('invokeai_workflow')) {
      return gen('invokeai', 'InvokeAI', keysOf('invokeai_metadata', 'invokeai_graph', 'invokeai_workflow'));
    }
    if (has('sd-metadata') || has('Dream')) {
      return gen('invokeai-legacy', 'InvokeAI (legacy)', keysOf('sd-metadata', 'Dream'));
    }

    if (byKey.Software && /novelai/i.test(byKey.Software.value)) {
      return gen('novelai', 'NovelAI', keysOf('Software', 'Title', 'Description', 'Comment', 'Source'), byKey.Source && byKey.Source.value);
    }

    if (has('fooocus_scheme') || (byKey.Comment && byKey.Comment.json && 'full_prompt' in byKey.Comment.json)) {
      return gen('fooocus', 'Fooocus', keysOf('parameters', 'fooocus_scheme', 'Comment'), byKey.fooocus_scheme && byKey.fooocus_scheme.value);
    }

    if (params && isA1111Text(params.value)) {
      const flavor = a1111Flavor(params.value);
      const keys = keysOf('parameters', 'postprocessing');
      const name = has('prompt') && byKey.prompt.json && isComfyApiGraph(byKey.prompt.json)
        ? 'ComfyUI (A1111-compatible parameters)'
        : flavor.name;
      return gen('a1111', name, has('prompt') ? keys.concat(keysOf('prompt', 'workflow')) : keys, flavor.detail);
    }
    if (has('postprocessing')) {
      return gen('a1111', 'AUTOMATIC1111 Extras', ['postprocessing']);
    }

    if (byKey.prompt && isComfyApiGraph(byKey.prompt.json)) {
      return gen('comfyui', 'ComfyUI', keysOf('prompt', 'workflow'), comfyVersion(byKey.workflow));
    }
    if (byKey.workflow && isComfyWorkflow(byKey.workflow.json)) {
      return gen('comfyui', 'ComfyUI (workflow only)', ['workflow'], comfyVersion(byKey.workflow));
    }

    if (has('prompt') && has('negative_prompt')) {
      return gen('easydiffusion', 'Easy Diffusion', record.entries.map(e => e.key));
    }

    if (has('XML:com.adobe.xmp')) {
      const xmp = byKey['XML:com.adobe.xmp'].value;
      if (/drawthings|com\.liuliu/i.test(xmp)) return gen('drawthings', 'Draw Things', ['XML:com.adobe.xmp']);
      return gen('xmp', 'XMP metadata', ['XML:com.adobe.xmp']);
    }

    if (record.entries.length === 0) return gen('none', 'No metadata', []);
    return gen('unknown', 'Unknown', []);
  }

  return { detect, isComfyApiGraph, isComfyWorkflow, isA1111Text };
})();

// ---- src/js/40-tree.js ----
// JSON tree on <details>/<summary>: collapsing is native, no handlers.
// Object children are rendered lazily on first expansion so that ComfyUI graphs
// with hundreds of nodes do not build thousands of DOM elements for nothing.
App.tree = (() => {
  const { h } = App.util;

  function typeOf(value) {
    if (value === null) return 'null';
    if (Array.isArray(value)) return 'array';
    return typeof value;
  }

  function formatScalar(value) {
    if (typeof value === 'string') return JSON.stringify(value);
    return String(value);
  }

  // Short hint in the header of a collapsed object: for ComfyUI nodes
  // it is class_type and title, for the UI graph it is type and id.
  function hint(value) {
    if (Array.isArray(value) || value === null || typeof value !== 'object') return null;
    if (typeof value.class_type === 'string') {
      const title = value._meta && typeof value._meta.title === 'string' ? value._meta.title : null;
      return title && title !== value.class_type ? `${value.class_type} · ${title}` : value.class_type;
    }
    if (typeof value.type === 'string' && 'id' in value) return `${value.type} #${value.id}`;
    if (typeof value.name === 'string') return value.name;
    return null;
  }

  function keyEl(key) {
    if (key === null) return null;
    return [h('span', { class: 'jt-key' }, String(key)), h('span', { class: 'jt-colon' }, ': ')];
  }

  function node(key, value, depth, opts) {
    const kind = typeOf(value);
    if (kind !== 'object' && kind !== 'array') {
      const sensitive = kind === 'string' && App.privacy.isSensitive(key, value);
      return h('div', { class: `jt-row${sensitive ? ' jt-private' : ''}` },
        keyEl(key),
        h('span', { class: `jt-val jt-${kind}` }, formatScalar(value)),
        sensitive ? App.privacy.badge() : null);
    }

    const isArray = kind === 'array';
    const entries = isArray ? value.map((v, i) => [i, v]) : Object.entries(value);
    const open = isArray ? '[' : '{';
    const close = isArray ? ']' : '}';

    if (entries.length === 0) {
      return h('div', { class: 'jt-row' }, keyEl(key), h('span', { class: 'jt-brace' }, open + close));
    }

    // decorate(value, key) may return { hint, className } for a specific object:
    // this is how workflow marks nodes that are absent from the executed prompt.
    const deco = opts.decorate ? opts.decorate(value, key) : null;
    const details = h('details', { class: `jt${deco && deco.className ? ' ' + deco.className : ''}`, open: depth < opts.openDepth });
    const summary = h('summary', { class: 'jt-sum' },
      keyEl(key),
      h('span', { class: 'jt-brace' }, open),
      h('span', { class: 'jt-count' }, `${entries.length} ${isArray ? 'items' : 'keys'}`),
      hint(value) ? h('span', { class: 'jt-hint' }, hint(value)) : null,
      deco && deco.hint ? h('span', { class: 'jt-deco' }, deco.hint) : null,
      h('span', { class: 'jt-brace jt-close' }, close));
    const body = h('div', { class: 'jt-body' });

    let filled = false;
    const fill = () => {
      if (filled) return;
      filled = true;
      for (const [k, v] of entries) body.append(node(k, v, depth + 1, opts));
    };
    details._fill = fill;
    if (details.open) fill();
    else details.addEventListener('toggle', fill, { once: true });

    details.append(summary, body);
    return details;
  }

  // render(value, { openDepth }) — the root element of the tree.
  function render(value, options) {
    const opts = Object.assign({ openDepth: 1 }, options);
    return h('div', { class: 'jt-root' }, node(null, value, 0, opts));
  }

  // Expands all levels taking lazy rendering into account: open layer by layer
  // until no closed details remain.
  function expandAll(root) {
    for (;;) {
      const closed = root.querySelectorAll('details.jt:not([open])');
      if (closed.length === 0) break;
      closed.forEach(d => { if (d._fill) d._fill(); d.open = true; });
    }
  }

  function collapseAll(root) {
    root.querySelectorAll('details.jt[open]').forEach(d => { d.open = false; });
    // Keep the root level open, otherwise only a single brace is visible.
    const first = root.querySelector('details.jt');
    if (first) first.open = true;
  }

  return { render, expandAll, collapseAll };
})();

// ---- src/js/50-ui.js ----
// Renders the UI from state. No reactivity: data changes only when files are
// added or a list item is selected, so the whole thing is redrawn.
App.ui = (() => {
  const { h, clear, formatBytes, copyText, downloadText } = App.util;

  const state = {
    files: [],      // records from App.source.readFile
    selected: -1,   // index of the selected record
  };

  let els = {};

  function mount(root) {
    els.root = root;
    App.icons.install();
    const icon = App.icons.svg;
    els.input = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', multiple: true, hidden: true,
      onChange: e => { App.app.addFiles(e.target.files); e.target.value = ''; } });

    els.fileList = h('ul', { class: 'filelist' });
    els.fileListHead = h('div', { class: 'filelist-head' });
    els.preview = h('div', { class: 'preview' });
    els.fileInfo = h('div', { class: 'fileinfo' });
    els.right = h('section', { class: 'right' });

    const dropzone = h('div', { class: 'dropzone', onClick: () => els.input.click() },
      h('div', { class: 'dz-title' }, icon('upload'), ' Drop images here'),
      h('div', { class: 'dz-sub' }, 'or click to choose files. PNG for now.'));
    els.dropzone = dropzone;

    // Preview always sits right below the drop zone, the file list follows in opening order.
    const left = h('aside', { class: 'left' },
      dropzone,
      els.preview,
      els.fileInfo,
      els.fileListHead,
      els.fileList);

    els.themeBtn = h('button', { class: 'btn btn-icon', title: 'Toggle light / dark theme', onClick: () => { App.settings.toggleTheme(); updateThemeButton(); } });
    els.highlightBtn = h('button', { class: 'btn btn-icon', title: 'Toggle prompt syntax highlighting', onClick: () => { App.settings.highlight = !App.settings.highlight; updateHighlightButton(); render(); } }, icon('highlighter'));
    updateThemeButton();
    updateHighlightButton();

    root.append(
      h('header', { class: 'topbar' },
        h('button', { class: 'brand', title: 'About', onClick: openAbout }, App.about.name),
        h('div', { class: 'topbar-actions' },
          h('button', { class: 'btn', onClick: () => els.input.click() }, icon('image-plus'), 'Add files'),
          h('span', { class: 'topbar-sep' }),
          els.highlightBtn,
          els.themeBtn)),
      h('main', { class: 'app' }, left, els.right),
      els.input);

    render();
  }

  function updateThemeButton() {
    clear(els.themeBtn);
    // Show what the button switches to: a sun in dark theme, a moon in light theme.
    els.themeBtn.append(App.icons.svg(App.settings.effectiveTheme() === 'dark' ? 'sun' : 'moon'));
  }

  function updateHighlightButton() {
    els.highlightBtn.classList.toggle('active', App.settings.highlight);
  }

  function render() {
    const current = state.files[state.selected] || null;
    renderFileList();
    renderPreview(current);
    renderRight(current);
    els.root.classList.toggle('has-files', state.files.length > 0);
    els.root.classList.toggle('single-file', state.files.length === 1);
  }

  function renderFileList() {
    clear(els.fileList);
    clear(els.fileListHead);
    if (state.files.length > 1) {
      els.fileListHead.append(
        h('span', { class: 'block-title' }, `Files · ${state.files.length}`),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn btn-sm btn-ghost', title: 'Remove every file except the current one', onClick: () => App.app.clearOthers() }, App.icons.svg('x'), 'Clear history'),
        h('button', { class: 'btn btn-sm btn-ghost', title: 'Remove all files from the list', onClick: () => App.app.clearAll() }, App.icons.svg('trash'), 'Clear all'));
    }
    // Newest files on top, indices remain indices into state.files.
    state.files.map((rec, i) => [rec, i]).reverse().forEach(([rec, i]) => {
      els.fileList.append(h('li', {
        class: `fileitem${i === state.selected ? ' active' : ''}`,
        title: rec.name,
        onClick: () => select(i),
      },
        h('img', { src: rec.url, alt: '' }),
        h('div', { class: 'fileitem-text' },
          h('div', { class: 'fileitem-name' }, rec.name),
          h('div', { class: 'fileitem-sub' }, rec.generator ? rec.generator.name : '')),
        h('button', { class: 'fileitem-remove', title: 'Remove from the list', onClick: e => { e.stopPropagation(); App.app.removeFile(i); } }, App.icons.svg('x'))));
    });
  }

  function renderPreview(rec) {
    clear(els.preview);
    clear(els.fileInfo);
    if (!rec) return;
    els.preview.append(h('img', { src: rec.url, alt: rec.name, title: 'Click to enlarge', onClick: () => openLightbox(rec) }));
    els.fileInfo.append(infoRow('File', rec.name));
    if (rec.width) {
      els.fileInfo.append(
        infoRow('Pixels', `${rec.width} × ${rec.height}`),
        infoRow('Aspect', aspectLabel(rec.width, rec.height)));
    }
    els.fileInfo.append(
      infoRow('Size', formatBytes(rec.size)),
      infoRow('Format', rec.format.toUpperCase()));
  }

  function infoRow(label, value) {
    return h('div', { class: 'info-row' }, h('span', { class: 'info-label' }, label), h('span', { class: 'info-value' }, value));
  }

  // Aspect ratio the way generators show it: the simplest of the common fractions
  // within three percent (SwarmUI calls 1216×832 "3:2" although it is 1.46),
  // otherwise the exact fraction; the decimal value is shown next to it.
  const COMMON_RATIOS = [[1, 1], [4, 3], [3, 4], [3, 2], [2, 3], [16, 9], [9, 16], [5, 4], [4, 5], [21, 9], [9, 21], [7, 4], [4, 7], [5, 3], [3, 5], [16, 10], [10, 16], [7, 5], [5, 7], [2, 1], [1, 2]];
  function aspectLabel(w, h) {
    const value = w / h;
    let best = null;
    for (const [a, b] of COMMON_RATIOS) {
      const diff = Math.abs(a / b - value) / value;
      const exact = diff < 0.001;
      if (diff > 0.03) continue;
      // An exact match beats fraction simplicity; among approximations take the simplest.
      if (!best || (exact && best.diff >= 0.001) || (exact === best.diff < 0.001 && a + b < best.a + best.b)) best = { a, b, diff };
    }
    const decimal = value.toFixed(2);
    if (best) return `${best.a}:${best.b}${best.diff > 0.001 ? ' ≈' : ''} (${decimal})`;
    const g = gcd(w, h);
    const a = w / g, b = h / g;
    return a <= 64 && b <= 64 ? `${a}:${b} (${decimal})` : decimal;
  }
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  // "About" card shown on header click.
  function openAbout() {
    const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    const a = App.about;
    const box = h('div', { class: 'lightbox about-backdrop', onClick: e => { if (e.target === box) close(); } },
      h('div', { class: 'about' },
        h('div', { class: 'about-title' }, a.name),
        h('div', { class: 'about-version' }, `version ${a.version}`),
        h('div', { class: 'about-row' }, 'by ', h('strong', a.author)),
        h('div', { class: 'about-row' }, a.repo
          ? h('a', { href: a.repo, target: '_blank', rel: 'noopener' }, a.repo)
          : h('span', { class: 'about-muted' }, 'Repository link coming soon')),
        h('p', { class: 'about-text' }, 'Everything runs in your browser. No image, prompt or metadata ever leaves your machine.'),
        h('p', { class: 'about-text' }, 'Thank you for using it.'),
        h('button', { class: 'btn', onClick: close }, 'Close')));
    document.addEventListener('keydown', onKey);
    document.body.append(box);
  }

  // Enlarged view over the page. A click anywhere or Esc closes it.
  function openLightbox(rec) {
    const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    const box = h('div', { class: 'lightbox', onClick: close },
      h('img', { src: rec.url, alt: rec.name }),
      h('div', { class: 'lightbox-caption' }, `${rec.name} · ${rec.width ? rec.width + ' × ' + rec.height : ''}`));
    document.addEventListener('keydown', onKey);
    document.body.append(box);
  }

  function renderRight(rec) {
    clear(els.right);
    if (!rec) {
      els.right.append(h('div', { class: 'empty' }, 'Metadata will appear here.'));
      return;
    }

    els.right.append(renderGenerator(rec));

    if (rec.warnings.length || rec.notes.length) {
      els.right.append(h('div', { class: 'warnings' },
        rec.warnings.map(w => h('div', { class: 'warning' }, w)),
        rec.notes.map(n => h('div', { class: 'note' }, n))));
    }

    if (rec.entries.length === 0) {
      els.right.append(h('div', { class: 'empty' }, 'No text chunks found in this file.'));
      return;
    }

    // Card on top if the generator was parsed; raw sections are collapsed then.
    // Without a card there is nothing else to show, so raw data is expanded right away.
    const hasCard = !!rec.card;
    if (hasCard) els.right.append(App.card.render(rec));
    els.right.append(h('div', { class: 'sections' },
      hasCard ? h('div', { class: 'block-title' }, 'Raw metadata') : null,
      rec.entries.map(e => renderEntry(e, !hasCard, rec))));
  }

  function renderGenerator(rec) {
    const g = rec.generator || { name: 'Unknown', keys: [] };
    return h('div', { class: `genbadge gen-${g.id}` },
      h('span', { class: 'gen-name' }, g.name),
      g.detail ? h('span', { class: 'gen-detail' }, g.detail) : null,
      g.keys.length ? h('span', { class: 'gen-keys' }, g.keys.map(k => h('code', k))) : null);
  }

  function renderEntry(entry, open, rec) {
    const isJson = entry.json !== null;
    const body = h('div', { class: 'sec-body' });
    let tree = null;
    if (isJson) {
      tree = App.tree.render(entry.json, { openDepth: 1, decorate: decoratorFor(entry, rec) });
      body.append(tree);
    } else {
      body.append(h('pre', { class: 'rawtext' }, entry.value));
    }

    const icon = App.icons.svg;
    const section = h('details', { class: 'sec', open });
    const actions = h('div', { class: 'sec-actions', onClick: e => e.preventDefault() },
      isJson ? h('button', { class: 'btn btn-sm', title: 'Expand all', onClick: () => { section.open = true; App.tree.expandAll(tree); } }, icon('chevrons-up-down'), 'Expand') : null,
      isJson ? h('button', { class: 'btn btn-sm', title: 'Collapse all', onClick: () => App.tree.collapseAll(tree) }, icon('chevrons-down-up'), 'Collapse') : null,
      h('button', { class: 'btn btn-sm', title: 'Copy to clipboard', onClick: e => flash(e.currentTarget, copyText(isJson ? JSON.stringify(entry.json, null, 2) : entry.value)) }, icon('copy'), 'Copy'),
      h('button', { class: 'btn btn-sm', title: 'Download as a file', onClick: () => downloadText(
        `${entry.key}.${isJson ? 'json' : 'txt'}`,
        isJson ? JSON.stringify(entry.json, null, 2) : entry.value,
        isJson ? 'application/json' : 'text/plain') }, icon('download'), 'Download'));

    section.append(
      h('summary', { class: 'sec-head' },
        h('span', { class: 'sec-key' }, entry.key),
        h('span', { class: 'sec-meta' }, `${entry.source} · ${isJson ? 'JSON' : 'text'} · ${formatBytes(entry.value.length)}`),
        actions),
      body);
    return section;
  }

  // For the ComfyUI UI graph, mark nodes missing from the executed prompt,
  // as well as bypass (mode 4) and mute (mode 2).
  function decoratorFor(entry, rec) {
    if (entry.key !== 'workflow' || !rec) return null;
    const executed = rec.card && rec.card.executed ? rec.card.executed : null;
    return (value) => {
      if (!value || typeof value !== 'object' || Array.isArray(value) || !('id' in value) || typeof value.type !== 'string') return null;
      const notes = [];
      if (value.mode === 4) notes.push('bypassed');
      if (value.mode === 2) notes.push('muted');
      if (executed && !executed.has(String(value.id))) notes.push('not executed');
      return notes.length ? { hint: notes.join(', '), className: 'jt-unused' } : null;
    };
  }

  // Brief feedback on the copy button: swap the content and restore it.
  async function flash(button, promise) {
    const saved = Array.from(button.childNodes);
    const ok = await promise;
    clear(button);
    button.append(App.icons.svg(ok ? 'check' : 'x'), ok ? 'Copied' : 'Failed');
    setTimeout(() => { clear(button); button.append(...saved); }, 1200);
  }

  function select(i) {
    state.selected = i;
    render();
  }

  return { state, mount, render, select, flash };
})();

// ---- src/js/55-parsers.js ----
// Registry of generator parsers and the unified card model.
//
// Each parser receives a record (see 20-source.js) and returns a card:
// {
//   positive: { text, original },      // original: the source prompt before wildcard expansion, or null
//   negative: { text, original },
//   params:   [{ label, value, sub }], // card grid in display order, sub is the second line
//   models:   [{ role, name, hash, weight, detail }],   // role: checkpoint | lora | vae | upscaler | embedding | refiner | controlnet
//   extra:    [{ key, value }],        // everything that did not fit the card, as a table
//   passes:   [{ label, positive, negative, params }] | null,   // ComfyUI: multiple samplers
//   textNodes:[{ id, classType, title, field, text }] | null,   // ComfyUI: all text nodes
//   notes:    [string],                // parser remarks, shown as warnings
// }
App.parsers = (() => {
  const registry = {};

  function register(generatorId, fn) {
    registry[generatorId] = fn;
  }

  function emptyCard() {
    return {
      positive: { text: '', original: null },
      negative: { text: '', original: null },
      params: [],
      models: [],
      extra: [],
      passes: null,
      textNodes: null,
      notes: [],
    };
  }

  // Adds a parameter, skipping empty values. sub is the card's second line
  // for a numeric suffix like "× 1.5" or "@ 0.75".
  function addParam(card, label, value, sub) {
    if (value === null || value === undefined || value === '') return;
    card.params.push({ label, value: String(value), sub: sub == null ? null : String(sub) });
  }

  function addExtra(card, key, value) {
    if (value === null || value === undefined || value === '') return;
    card.extra.push({ key, value: typeof value === 'object' ? JSON.stringify(value) : String(value) });
  }

  function parse(record) {
    const id = record.generator && record.generator.id;
    const fn = registry[id];
    if (!fn) return null;
    try {
      return fn(record);
    } catch (e) {
      record.warnings.push(`Parser for ${record.generator.name} failed: ${e.message}`);
      return null;
    }
  }

  return { register, parse, emptyCard, addParam, addExtra };
})();

// ---- src/js/60-parse-a1111.js ----
// Text format of AUTOMATIC1111 / Forge / SD.Next and compatible tools:
//   prompt
//   Negative prompt: negative
//   Steps: 20, Sampler: Euler a, CFG scale: 7, Seed: 1, Size: 512x512, Model hash: abc, Model: x, ...
App.parsers.register('a1111', (record) => {
  const { emptyCard, addParam, addExtra } = App.parsers;
  const card = emptyCard();
  const entry = record.entries.find(e => e.key === 'parameters');
  const post = record.entries.find(e => e.key === 'postprocessing');
  if (!entry) {
    if (post) card.extra.push({ key: 'postprocessing', value: post.value });
    return card;
  }

  const { positive, negative, pairs } = App.parsers.parseA1111Text(entry.value);
  card.positive.text = positive;
  card.negative.text = negative;

  // Card order is fixed, the rest goes to extra.
  const take = (key) => {
    if (!(key in pairs)) return null;
    const v = pairs[key];
    delete pairs[key];
    return v;
  };

  const model = take('Model');
  const modelHash = take('Model hash');
  const vae = take('VAE');
  const vaeHash = take('VAE hash');

  addParam(card, 'Model', model);
  addParam(card, 'Seed', take('Seed'));
  addParam(card, 'Steps', take('Steps'));
  addParam(card, 'CFG', take('CFG scale'));
  addParam(card, 'Sampler', take('Sampler'));
  addParam(card, 'Scheduler', take('Schedule type'));
  addParam(card, 'Size', take('Size'));
  addParam(card, 'Clip skip', take('Clip skip'));
  addParam(card, 'Denoise', take('Denoising strength'));
  addParam(card, 'Hires upscale', take('Hires upscale'));
  addParam(card, 'Hires upscaler', take('Hires upscaler'));
  addParam(card, 'Hires steps', take('Hires steps'));
  addParam(card, 'Version', take('Version'));

  if (model || modelHash) card.models.push({ role: 'checkpoint', name: model || '(unknown)', hash: modelHash || null, weight: null });
  if (vae) card.models.push({ role: 'vae', name: vae, hash: vaeHash || null, weight: null });

  // LoRA: weights from <lora:name:w> tags in the prompt, hashes from "Lora hashes".
  const loraWeights = {};
  for (const m of positive.matchAll(/<lora:([^:>]+)(?::([\d.]+))?[^>]*>/g)) loraWeights[m[1]] = m[2] || null;
  const loraHashes = App.parsers.parseHashList(take('Lora hashes'));
  const loraNames = new Set([...Object.keys(loraWeights), ...Object.keys(loraHashes)]);
  for (const name of loraNames) {
    card.models.push({ role: 'lora', name, hash: loraHashes[name] || null, weight: loraWeights[name] || null });
  }
  const tiHashes = App.parsers.parseHashList(take('TI hashes'));
  for (const [name, hash] of Object.entries(tiHashes)) card.models.push({ role: 'embedding', name, hash, weight: null });

  for (const [k, v] of Object.entries(pairs)) addExtra(card, k, v);
  if (post) card.extra.push({ key: 'postprocessing', value: post.value });
  return card;
});

// Parsing of the string itself, kept separate: Fooocus in A1111 mode uses it too,
// and EXIF UserComment will in the future.
App.parsers.parseA1111Text = function parseA1111Text(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  let paramIdx = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (/^Steps:\s*\d+/.test(lines[i])) { paramIdx = i; break; }
  }
  const head = (paramIdx >= 0 ? lines.slice(0, paramIdx) : lines).join('\n');
  const paramLine = paramIdx >= 0 ? lines[paramIdx] : '';

  let positive = head;
  let negative = '';
  const negMatch = /(^|\n)Negative prompt:\s?/.exec(head);
  if (negMatch) {
    positive = head.slice(0, negMatch.index);
    negative = head.slice(negMatch.index + negMatch[0].length);
  }

  // "Key: value" pairs; the value runs either up to a comma or is quoted (may contain commas and JSON).
  const pairs = {};
  const re = /\s*([^,:]+?):\s*("(?:\\.|[^\\"])*"|[^,]*)(?:,|$)/g;
  let m;
  while ((m = re.exec(paramLine)) !== null) {
    if (m.index === re.lastIndex) re.lastIndex++;
    const key = m[1].trim();
    let value = m[2].trim();
    if (value.startsWith('"') && value.endsWith('"')) {
      try { value = JSON.parse(value); } catch (_) { value = value.slice(1, -1); }
    }
    if (key) pairs[key] = value;
  }

  return { positive: positive.trim(), negative: negative.trim(), pairs };
};

// "name: hash, name2: hash2" or a JSON object -> { name: hash }
App.parsers.parseHashList = function parseHashList(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  const out = {};
  for (const part of String(value).split(',')) {
    const i = part.lastIndexOf(':');
    if (i > 0) out[part.slice(0, i).trim()] = part.slice(i + 1).trim();
  }
  return out;
};

// ---- src/js/61-parse-swarmui.js ----
// SwarmUI: parameters = JSON { sui_image_params, sui_extra_data, sui_models }.
App.parsers.register('swarmui', (record) => {
  const { emptyCard, addParam, addExtra } = App.parsers;
  const card = emptyCard();
  const json = record.entries.find(e => e.key === 'parameters').json;
  const p = Object.assign({}, json.sui_image_params || {});
  const extraData = Object.assign({}, json.sui_extra_data || {});
  const models = Array.isArray(json.sui_models) ? json.sui_models : [];

  const take = (key) => {
    if (!(key in p)) return null;
    const v = p[key];
    delete p[key];
    return v;
  };
  const takeExtra = (key) => {
    if (!(key in extraData)) return null;
    const v = extraData[key];
    delete extraData[key];
    return v;
  };

  card.positive.text = String(take('prompt') || '');
  card.negative.text = String(take('negativeprompt') || '');
  const originalPrompt = takeExtra('original_prompt');
  const originalNegative = takeExtra('original_negativeprompt');
  if (originalPrompt != null && originalPrompt !== card.positive.text) card.positive.original = String(originalPrompt);
  if (originalNegative != null && originalNegative !== card.negative.text) card.negative.original = String(originalNegative);

  // Checkpoint name: either the explicit model field or the parameter referenced by sui_models.
  const hashes = {};
  let modelName = take('model');
  for (const m of models) {
    if (m && m.name) hashes[stripExt(m.name)] = m.hash || null;
    if (!modelName && m && m.param && m.param !== 'loras' && m.param in p) modelName = take(m.param);
  }

  const width = take('width');
  const height = take('height');
  const size = width && height ? `${width} × ${height}` : null;
  const aspect = take('aspectratio');

  addParam(card, 'Model', modelName);
  addParam(card, 'Seed', take('seed'));
  addParam(card, 'Steps', take('steps'));
  addParam(card, 'CFG', take('cfgscale'));
  addParam(card, 'Sampler', take('sampler'));
  addParam(card, 'Scheduler', take('scheduler'));
  addParam(card, 'Size', size ? (aspect ? `${size} (${aspect})` : size) : aspect);
  addParam(card, 'Clip skip', take('clipstopatlayer'));
  addParam(card, 'Init creativity', take('initimagecreativity'));
  const refinerUpscale = take('refinerupscale');
  if (refinerUpscale) {
    const method = take('refinerupscalemethod');
    addParam(card, 'Refiner upscale', method || `× ${refinerUpscale}`, method ? `× ${refinerUpscale}` : null);
    addParam(card, 'Refiner control', take('refinercontrolpercentage'));
    addParam(card, 'Refiner method', take('refinermethod'));
  }
  addParam(card, 'Batch', take('batchsize'));
  take('swarm_version'); // version is already in the card header

  if (modelName) card.models.push({ role: 'checkpoint', name: modelName, hash: hashes[stripExt(modelName)] || null, weight: null });

  const refinerModel = take('refinermodel');
  if (refinerModel) card.models.push({ role: 'refiner', name: refinerModel, hash: hashes[stripExt(refinerModel)] || null, weight: null });

  const vae = take('vae');
  if (vae) card.models.push({ role: 'vae', name: vae, hash: hashes[stripExt(vae)] || null, weight: null });
  else if (take('automaticvae')) addExtra(card, 'vae', 'automatic');

  // LoRA: comma-separated strings or arrays, weights as a parallel list.
  const loras = toList(take('loras'));
  const weights = toList(take('loraweights'));
  loras.forEach((name, i) => {
    card.models.push({ role: 'lora', name, hash: hashes[stripExt(name)] || null, weight: weights[i] != null ? String(weights[i]) : null });
  });

  const wildcards = takeExtra('used_wildcards');
  if (wildcards) addExtra(card, 'used_wildcards', Array.isArray(wildcards) ? wildcards.join(', ') : wildcards);

  // Internal generation timings are of no use in the card, they stay in the raw JSON.
  for (const k of ['prep_time', 'generation_time', 'intermediate']) delete extraData[k];
  for (const [k, v] of Object.entries(p)) addExtra(card, k, v);
  for (const [k, v] of Object.entries(extraData)) addExtra(card, k, v);
  return card;

  function stripExt(name) {
    return String(name).replace(/\.(safetensors|ckpt|pt|pth|bin|gguf)$/i, '');
  }
  function toList(v) {
    if (v == null || v === '') return [];
    if (Array.isArray(v)) return v;
    return String(v).split(',').map(s => s.trim()).filter(Boolean);
  }
});

// ---- src/js/62-parse-comfyui.js ----
// ComfyUI: prompt = API graph { id: { class_type, inputs, _meta } }.
// If there is no prompt, the workflow UI graph is converted to the same shape (see 64-comfy-workflow.js).
// The strategy is structural, with no list of node types: a sampler is a node with
// positive and negative inputs (or guider for SamplerCustomAdvanced); text is found
// by following links from those inputs, model and LoRA via the model chain.
App.parsers.register('comfyui', (record) => {
  const { emptyCard } = App.parsers;
  const card = emptyCard();
  const promptEntry = record.entries.find(e => e.key === 'prompt');
  const workflowEntry = record.entries.find(e => e.key === 'workflow');

  let graph = null;
  let executed = null;
  let status = null;
  let notes = [];

  if (promptEntry && promptEntry.json) {
    graph = promptEntry.json;
    executed = new Set(Object.keys(graph));
  } else if (workflowEntry && workflowEntry.json && Array.isArray(workflowEntry.json.nodes)) {
    const converted = App.comfyWorkflow.convert(workflowEntry.json);
    graph = converted.graph;
    executed = App.comfyWorkflow.executedSet(graph);
    status = converted.status;
    notes = converted.notes;
    card.notes.push('No API graph (prompt) in the file, values are reconstructed from the UI workflow: widget names for custom nodes are guessed.');
  } else {
    card.notes.push('Neither prompt nor workflow JSON is readable.');
    return card;
  }

  const analysis = App.parsers.analyzeComfyGraph(graph);
  card.notes.push(...analysis.notes);

  // Text nodes: those used in generation, then unconnected ones, then canvas notes.
  const used = analysis.textNodes.filter(t => t.used).map(t => ({ ...t, kind: 'used' }));
  const unused = analysis.textNodes.filter(t => !t.used).map(t => ({ ...t, kind: 'unused' }));
  card.textNodes = [...used, ...unused, ...notes];

  if (analysis.passes.length === 0) {
    card.notes.push('No sampler node found in the graph, showing text nodes only.');
  } else {
    const main = analysis.passes[0];
    card.positive.text = main.positive;
    card.negative.text = main.negative;
    card.params = main.params.slice();
    if (analysis.passes.length > 1) card.passes = analysis.passes;
  }

  card.models = analysis.models;
  const checkpoint = analysis.models.find(m => m.role === 'checkpoint');
  if (checkpoint) card.params.unshift({ label: 'Model', value: checkpoint.name, sub: checkpoint.detail || null });

  // What on the canvas was actually executed: the workflow tree needs it for markers.
  card.executed = executed;
  card.nodeStatus = status;
  return card;
});

// Graph analysis is split out so tree highlighting and check.html can use it too.
App.parsers.analyzeComfyGraph = function analyzeComfyGraph(graph) {
  const TEXT_FIELDS = ['text', 'prompt', 'text_g', 'text_l', 'string', 'positive', 'negative', 'wildcard_text', 'populated_text', 'clip_l', 't5xxl', 'value'];
  // Do not walk up through these inputs: they lead to loaders and images, not text.
  const STOP_FIELDS = new Set(['clip', 'clip1', 'clip2', 'model', 'model1', 'model2', 'vae', 'latent', 'latent_image', 'samples', 'image', 'images', 'pixels', 'mask', 'upscale_model', 'control_net', 'style_model', 'clip_vision', 'clip_vision_output', 'sampler', 'sigmas', 'noise', 'guider']);
  const CONTROL_FIELDS = new Set(['sampler', 'sigmas', 'noise', 'guider', 'scheduler']);
  const CLIP_FIELDS = ['clip', 'clip1', 'clip2'];

  const notes = [];
  const node = id => graph[String(id)];
  const isLink = v => Array.isArray(v) && v.length === 2 && (typeof v[0] === 'string' || typeof v[0] === 'number');
  const title = n => (n && n._meta && n._meta.title) || null;

  // Scalar input value: either stored on the node or linked from a primitive.
  function scalar(n, key) {
    if (!n || !n.inputs || !(key in n.inputs)) return null;
    const v = n.inputs[key];
    if (!isLink(v)) return v;
    const src = node(v[0]);
    if (!src || !src.inputs) return null;
    for (const k of ['value', key, 'string', 'text', 'int', 'float', 'number']) {
      if (k in src.inputs && !isLink(src.inputs[k])) return src.inputs[k];
    }
    const firstScalar = Object.values(src.inputs).find(x => !isLink(x) && x !== null && typeof x !== 'object');
    return firstScalar === undefined ? null : firstScalar;
  }

  // All text nodes for the tabs; used is set while walking from the samplers.
  const textNodes = [];
  const textNodeIds = new Set();
  for (const [id, n] of Object.entries(graph)) {
    if (!n || !n.inputs) continue;
    for (const field of TEXT_FIELDS) {
      const v = n.inputs[field];
      if (typeof v === 'string' && v.trim() !== '') {
        textNodes.push({ id, classType: n.class_type, title: title(n), field, text: v, used: false });
        textNodeIds.add(id);
      }
    }
  }
  const markUsed = id => { for (const t of textNodes) if (t.id === String(id)) t.used = true; };

  // Text upstream of a node. For nodes with paired positive/negative inputs
  // (ControlNetApplyAdvanced and the like) follow only the branch whose output
  // we arrived through: slot 0 is positive, slot 1 is negative.
  function collectText(startId, startSlot, controlnets) {
    const found = [];
    const visited = new Set();
    const walk = (id, slot, depth) => {
      const key = String(id);
      if (visited.has(key) || depth > 24) return;
      visited.add(key);
      const n = node(key);
      if (!n || !n.inputs) return;
      const inp = n.inputs;
      const own = [];
      for (const field of TEXT_FIELDS) {
        const v = inp[field];
        if (typeof v === 'string' && v.trim() !== '') own.push({ field, text: v });
      }
      if (own.length) markUsed(key);
      if (own.length === 2 && own[0].field === 'text_g' && own[1].field === 'text_l' && own[0].text === own[1].text) own.pop();
      for (const o of own) found.push(o.field === 'text_l' || o.field === 'text_g' ? `[${o.field}] ${o.text}` : o.text);

      if (controlnets && isLink(inp.control_net)) {
        const loader = node(inp.control_net[0]);
        const name = loader && loader.inputs && (loader.inputs.control_net_name || loader.inputs.model_name);
        if (name) controlnets.push({ role: 'controlnet', name: String(name), hash: null, weight: inp.strength != null ? String(inp.strength) : null });
      }

      const paired = isLink(inp.positive) && isLink(inp.negative);
      for (const [field, v] of Object.entries(inp)) {
        if (!isLink(v) || STOP_FIELDS.has(field)) continue;
        if (paired && (field === 'positive' || field === 'negative')) {
          const want = slot === 1 ? 'negative' : 'positive';
          if (field !== want) continue;
        }
        walk(v[0], v[1], depth + 1);
      }
    };
    walk(startId, startSlot, 0);
    return found.join('\n');
  }

  // Parameter lookup: on the node itself, then upstream via control inputs (sampler, sigmas, noise, guider).
  function findParam(startId, keys) {
    const visited = new Set();
    const queue = [String(startId)];
    while (queue.length) {
      const id = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      const n = node(id);
      if (!n || !n.inputs) continue;
      for (const k of keys) {
        if (k in n.inputs) {
          const v = scalar(n, k);
          if (v !== null && v !== undefined) return v;
        }
      }
      for (const [field, v] of Object.entries(n.inputs)) {
        if (isLink(v) && CONTROL_FIELDS.has(field)) queue.push(String(v[0]));
      }
    }
    return null;
  }

  // Upstream lookup over an arbitrary set of fields, for clip skip via the clip chain.
  function findUp(startId, fields, key, depth = 0, visited = new Set()) {
    const id = String(startId);
    if (visited.has(id) || depth > 32) return null;
    visited.add(id);
    const n = node(id);
    if (!n || !n.inputs) return null;
    if (key in n.inputs && !isLink(n.inputs[key])) return n.inputs[key];
    for (const f of fields) {
      if (isLink(n.inputs[f])) {
        const r = findUp(n.inputs[f][0], fields, key, depth + 1, visited);
        if (r !== null) return r;
      }
    }
    return null;
  }

  // Model chain: LoRAs along the way, checkpoint or UNET at the end, merges expanded recursively.
  function modelChain(startId, depth = 0) {
    const loras = [];
    let checkpoint = null;
    const visited = new Set();
    let id = startId != null ? String(startId) : null;
    while (id && !visited.has(id) && depth < 8) {
      visited.add(id);
      const n = node(id);
      if (!n || !n.inputs) break;
      const inp = n.inputs;
      if (typeof inp.lora_name === 'string') {
        loras.push({ role: 'lora', name: inp.lora_name, hash: null, weight: inp.strength_model != null ? String(inp.strength_model) : null });
      }
      const ckpt = inp.ckpt_name || inp.unet_name;
      if (typeof ckpt === 'string') { checkpoint = { role: 'checkpoint', name: ckpt, hash: null, weight: null }; break; }
      if (isLink(inp.model1) && isLink(inp.model2)) {
        const a = modelChain(inp.model1[0], depth + 1);
        const b = modelChain(inp.model2[0], depth + 1);
        loras.push(...a.loras, ...b.loras);
        checkpoint = {
          role: 'checkpoint',
          name: `${a.checkpoint ? a.checkpoint.name : '?'} + ${b.checkpoint ? b.checkpoint.name : '?'}`,
          hash: null, weight: null,
          detail: inp.ratio != null ? `merge @ ${inp.ratio}` : 'merge',
        };
        break;
      }
      const next = isLink(inp.model) ? inp.model : (isLink(inp.unet) ? inp.unet : null);
      id = next ? String(next[0]) : null;
    }
    return { loras, checkpoint };
  }

  // Latent size: EmptyLatentImage, upscale by factor, or the image feeding VAEEncode.
  function latentInfo(startId) {
    const visited = new Set();
    let id = startId != null ? String(startId) : null;
    while (id && !visited.has(id) && visited.size < 32) {
      visited.add(id);
      const n = node(id);
      if (!n || !n.inputs) break;
      const inp = n.inputs;
      const w = scalar(n, 'width'), h = scalar(n, 'height');
      if (typeof w === 'number' && typeof h === 'number') return { size: `${w} × ${h}`, sub: null, source: n.class_type };
      if (inp.scale_by != null && !isLink(inp.scale_by)) return { size: inp.upscale_method || 'upscale', sub: `× ${inp.scale_by}`, source: n.class_type };
      if (typeof inp.image === 'string') return { size: null, source: `image: ${inp.image}` };
      const next = ['latent_image', 'samples', 'latent', 'pixels', 'image', 'images'].map(f => inp[f]).find(isLink);
      id = next ? String(next[0]) : null;
    }
    return { size: null, sub: null, source: null };
  }

  // Samplers: positive+negative directly on the node, or via a guider.
  const samplers = [];
  for (const [id, n] of Object.entries(graph)) {
    if (!n || !n.inputs) continue;
    const inp = n.inputs;
    if (isLink(inp.positive) && isLink(inp.negative) && (isLink(inp.model) || isLink(inp.latent_image))) {
      samplers.push({ id, n, condNode: n });
    } else if (isLink(inp.guider) && isLink(inp.latent_image)) {
      const g = node(inp.guider[0]);
      samplers.push({ id, n, condNode: g && g.inputs ? g : null });
    }
  }

  const passes = samplers.map(({ id, n, condNode }) => {
    const inp = n.inputs;
    const cond = condNode ? condNode.inputs : {};
    const controlnets = [];
    const posLink = isLink(cond.positive) ? cond.positive : (isLink(cond.conditioning) ? cond.conditioning : null);
    const positive = posLink ? collectText(posLink[0], posLink[1], controlnets) : '';
    const negative = isLink(cond.negative) ? collectText(cond.negative[0], cond.negative[1], null) : '';
    const startStep = inp.start_at_step != null ? Number(scalar(n, 'start_at_step')) : 0;
    const modelLink = isLink(inp.model) ? inp.model[0] : (isLink(cond.model) ? cond.model[0] : null);
    const chain = modelChain(modelLink);
    const latent = latentInfo(isLink(inp.latent_image) ? inp.latent_image[0] : null);
    const clipSkip = posLink ? findUp(posLink[0], CLIP_FIELDS.concat(['positive', 'conditioning']), 'stop_at_clip_layer') : null;

    const params = [];
    // Numbers from JSON can look like 0.7000000000000001; round them for the card.
    const fmt = v => typeof v === 'number' ? String(Number(v.toFixed(4))) : String(v);
    const push = (label, value, sub) => { if (value !== null && value !== undefined && value !== '') params.push({ label, value: fmt(value), sub: sub == null ? null : String(sub) }); };
    push('Seed', findParam(id, ['seed', 'noise_seed']));
    push('Steps', findParam(id, ['steps']));
    push('CFG', findParam(id, ['cfg']));
    push('Sampler', findParam(id, ['sampler_name']));
    push('Scheduler', findParam(id, ['scheduler']));
    push('Denoise', findParam(id, ['denoise']));
    push('Size', latent.size, latent.sub);
    if (latent.source && !latent.size) push('Latent from', latent.source);
    push('Clip skip', clipSkip);
    // Show the step range only when it is actually truncated (refiner, hires).
    const endRaw = scalar(n, 'end_at_step');
    const totalSteps = Number(findParam(id, ['steps']));
    const endStep = endRaw != null && Number(endRaw) < 10000 && !(totalSteps && Number(endRaw) >= totalSteps) ? Number(endRaw) : null;
    if (startStep > 0 || endStep !== null) push('Step range', `${startStep} → ${endStep === null ? 'end' : endStep}`);

    return {
      id,
      label: `${title(n) && title(n) !== n.class_type ? title(n) : n.class_type} #${id}`,
      positive,
      negative,
      params,
      models: [chain.checkpoint, ...chain.loras, ...controlnets].filter(Boolean),
      startStep,
      fromEmptyLatent: latent.source ? /Empty/i.test(latent.source) : false,
    };
  });

  // Main pass: starts from an empty latent and step zero; refiner and hires come later.
  passes.sort((a, b) => (b.fromEmptyLatent - a.fromEmptyLatent) || (a.startStep - b.startStep) || (Number(a.id) - Number(b.id)));

  // Models: merged across passes without duplicates; VAE and upscalers searched over the whole graph.
  const models = [];
  const seen = new Set();
  const addModel = m => {
    const k = `${m.role}:${m.name}:${m.weight}`;
    if (!seen.has(k)) { seen.add(k); models.push(m); }
  };
  for (const p of passes) for (const m of p.models) addModel(m);
  for (const n of Object.values(graph)) {
    if (!n || !n.inputs) continue;
    if (typeof n.inputs.vae_name === 'string') addModel({ role: 'vae', name: n.inputs.vae_name, hash: null, weight: null });
    if (typeof n.inputs.model_name === 'string' && /upscale/i.test(n.class_type || '')) addModel({ role: 'upscaler', name: n.inputs.model_name, hash: null, weight: null });
  }

  return { passes, textNodes, models, notes };
};

// ---- src/js/63-parse-invokeai.js ----
// InvokeAI: invokeai_metadata (current JSON), sd-metadata and Dream (older versions).
// Written from documentation and reference code, no real sample was available:
// verified only on synthetic fixtures.
App.parsers.register('invokeai', (record) => {
  const { emptyCard, addParam, addExtra } = App.parsers;
  const card = emptyCard();
  const entry = record.entries.find(e => e.key === 'invokeai_metadata');
  if (!entry || !entry.json) {
    card.notes.push('invokeai_metadata is missing or not JSON, only graph/workflow are present.');
    return card;
  }
  const m = Object.assign({}, entry.json);
  const take = (key) => { if (!(key in m)) return null; const v = m[key]; delete m[key]; return v; };
  const name = obj => (obj && typeof obj === 'object') ? (obj.name || obj.model_name || obj.key || null) : (obj == null ? null : String(obj));

  card.positive.text = String(take('positive_prompt') || '');
  card.negative.text = String(take('negative_prompt') || '');
  const styleP = take('positive_style_prompt');
  const styleN = take('negative_style_prompt');
  if (styleP && styleP !== card.positive.text) addExtra(card, 'positive_style_prompt', styleP);
  if (styleN && styleN !== card.negative.text) addExtra(card, 'negative_style_prompt', styleN);

  const model = take('model');
  const width = take('width');
  const height = take('height');

  addParam(card, 'Model', name(model));
  addParam(card, 'Seed', take('seed'));
  addParam(card, 'Steps', take('steps'));
  addParam(card, 'CFG', take('cfg_scale'));
  addParam(card, 'CFG rescale', take('cfg_rescale_multiplier'));
  addParam(card, 'Scheduler', take('scheduler'));
  addParam(card, 'Size', width && height ? `${width} × ${height}` : null);
  addParam(card, 'Clip skip', take('clip_skip'));
  addParam(card, 'Denoise', take('strength'));
  addParam(card, 'Mode', take('generation_mode'));
  addParam(card, 'Version', take('app_version'));

  if (model) card.models.push({ role: 'checkpoint', name: name(model), hash: model.hash || null, weight: null });
  const vae = take('vae');
  if (vae) card.models.push({ role: 'vae', name: name(vae), hash: vae.hash || null, weight: null });
  const refiner = take('refiner_model');
  if (refiner) card.models.push({ role: 'refiner', name: name(refiner), hash: refiner.hash || null, weight: null });
  const loras = take('loras');
  if (Array.isArray(loras)) {
    for (const l of loras) {
      const lm = l && (l.model || l.lora || l);
